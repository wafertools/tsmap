[package]
name = "tsmap"
version = "0.1.34"
description = "Desktop application for loading and visualising semiconductor wafer map data"
authors = ["Paul Robins"]
edition = "2024"
license = "MIT"
repository = "https://github.com/wafertools/tsmap"
default-run = "tsmap"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tsmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Stays on the default GTK3 backend (not the "xdg-portal" feature) even
# though switching to it visibly fixed a blank-rows rendering bug in the
# filter-type dropdown on Ubuntu (isolated via zenity — same theme, same
# filter names, clean render, so the bug is specific to rfd's GTK3 combo
# code, not tsmap or the system theme). Reverted anyway: rfd's xdg-portal
# backend needs libdbus, an actual portal backend (GTK/GNOME/KDE flavour)
# installed at runtime, and falls back to shelling out to `zenity` if the
# portal call fails — none of which is guaranteed on the AppImage's "other"
# distro audience (tiling-WM/minimal setups without a desktop portal
# daemon). GTK3 itself is already a hard dependency via WebKitGTK, so it's
# the only backend that imposes nothing extra. Trading a cosmetic dropdown
# glitch for a real risk of Open/Filter files failing outright on some
# installs is the wrong trade — the blank rows are a known cosmetic
# limitation, not fixed here.
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-single-instance = "2"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "fs", "io-util"] }
libc = "0.2.186"
zip = "8.6.0"
testdata-parser = { path = "../packages/parsers", features = ["native"] }
# Hand-rolled fetch command rather than tauri-plugin-http: the plugin's scope
# system requires pre-configured glob-pattern allow-lists, which doesn't fit
# "fetch whatever URL the caller supplies" (see plans/open-from-url-ingestion.md
# for the researched rejection). rustls-tls avoids an OpenSSL system dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-deep-link = "2.4.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
