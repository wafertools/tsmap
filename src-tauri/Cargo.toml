[package]
name = "tsmap"
version = "0.1.28"
description = "Desktop application for loading and visualising semiconductor wafer map data"
authors = ["Paul Robins"]
edition = "2024"
default-run = "tsmap"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tsmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-single-instance = "2"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "fs", "io-util"] }
libc = "0.2.186"
zip = "8.6.0"
testdata-parser = { path = "../packages/parsers", features = ["native"] }
# Hand-rolled fetch command rather than tauri-plugin-http: the plugin's scope
# system requires pre-configured glob-pattern allow-lists, which doesn't fit
# "fetch whatever URL the caller supplies" (see plans/open-from-url-ingestion.md
# for the researched rejection). rustls-tls avoids an OpenSSL system dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-deep-link = "2.4.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
