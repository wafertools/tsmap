name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Release flow: each build job produces its platform's bundles, renames them to a
# consistent, human-readable scheme, and uploads them to a single GitHub release.
# tauri-action is used for *building only* (createRelease: false) so we control the
# final asset names — Tauri's bundler emits inconsistent names (underscores vs
# dashes, an rpm "-1" suffix, cryptic arch tokens) that confuse users on the
# release page. Naming scheme: tsmap-<version>-<os>-<arch/variant>.<ext>
jobs:
  test:
    uses: ./.github/workflows/test.yml

  # One job creates the release shell up front so every build job uploads into it.
  create-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create release with download guide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          ## Which download do I need?

          | Your system | Download |
          | --- | --- |
          | **Windows 10 / 11** | `tsmap-VERSION-windows-x64.msi` |
          | **Mac — Apple Silicon** (any M-series: M1–M5 and newer) | `tsmap-VERSION-macos-apple-silicon.dmg` |
          | **Mac — Intel** | `tsmap-VERSION-macos-intel.dmg` |
          | **Linux — Ubuntu / Debian** (installer) | `tsmap-VERSION-linux-x86_64.deb` |
          | **Linux — Fedora** (installer) | `tsmap-VERSION-linux-x86_64.rpm` |
          | **Linux — other / portable** (no install) | `tsmap-VERSION-linux-x86_64.AppImage` |
          | **Linux — RHEL / Rocky / Alma 8 or 9** | [browser version](https://wafertools.github.io/tsmap/app/) — installable as an app in Chrome/Chromium/Edge |
          | **Host it yourself** (intranet / air-gapped) | `tsmap-VERSION-web.zip` |

          **Not sure on Mac?**  Apple menu → About This Mac. "Apple M…" = Apple Silicon; "Intel" = Intel.

          **AppImage** needs no installation: download, `chmod +x` it, and run. It targets
          current distributions (glibc 2.35+ / Ubuntu 22.04 and newer).

          **On RHEL / Rocky / Alma?** The desktop app's webview needs newer system libraries
          than those releases ship — run the [browser version](https://wafertools.github.io/tsmap/app/)
          instead. It works in any modern browser, and in Chrome, Chromium or Edge it can be
          installed as an app — its own window and launcher entry, working offline, with no
          package to install. Firefox on the desktop cannot install web apps, so there is no
          install button there; it still works as an ordinary page. See
          [Installing tsmap as an app](https://wafertools.github.io/tsmap/web/#installing-tsmap-as-an-app).

          **`tsmap-VERSION-web.zip`** is the browser version as a static site, for hosting on
          your own intranet. Unpack it into any web server's document root and browse to it —
          no installer, no server-side component, and no internet access required, at install
          time or afterwards. Wafer files are parsed in the browser and never leave the machine.
          See [Hosting tsmap on your own server](https://wafertools.github.io/tsmap/web/#hosting-tsmap-on-your-own-server).
          EOF
          sed -i "s/VERSION/${GITHUB_REF_NAME#v}/g" notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY" || \
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --repo "$GITHUB_REPOSITORY"

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      # Full history (not the default shallow clone) — this build runs `npm run
      # build` -> prebuild -> scripts/check-testdata-parser-published.js, which
      # needs git log on packages/parsers/ to detect source drift since the
      # crate's last version bump; a shallow clone makes it silently skip that check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Build only — we rename and upload ourselves below.
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - name: Rename and upload artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          B="target/${TARGET}/release/bundle"
          stage="$(mktemp -d)"

          copyas() { # copyas <glob> <newname>  — no-op if glob matches nothing
            local matches=( $1 )
            [ -e "${matches[0]}" ] || { echo "skip (not found): $1"; return 0; }
            cp "${matches[0]}" "$stage/$2"
            echo "staged: $2"
          }

          case "$TARGET" in
            x86_64-pc-windows-msvc)
              copyas "$B/msi/*.msi"           "tsmap-${VERSION}-windows-x64.msi"
              copyas "$B/nsis/*-setup.exe"    "tsmap-${VERSION}-windows-x64-setup.exe"
              ;;
            x86_64-apple-darwin)
              copyas "$B/dmg/*.dmg"           "tsmap-${VERSION}-macos-intel.dmg"
              ;;
            aarch64-apple-darwin)
              copyas "$B/dmg/*.dmg"           "tsmap-${VERSION}-macos-apple-silicon.dmg"
              ;;
            x86_64-unknown-linux-gnu)
              copyas "$B/appimage/*.AppImage" "tsmap-${VERSION}-linux-x86_64.AppImage"
              copyas "$B/deb/*.deb"           "tsmap-${VERSION}-linux-x86_64.deb"
              copyas "$B/rpm/*.rpm"           "tsmap-${VERSION}-linux-x86_64.rpm"
              ;;
          esac

          # .app.tar.gz updater bundles are deliberately not uploaded — they duplicate
          # the .dmg and only confused users on the release page.

          shopt -s nullglob
          files=( "$stage"/* )
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          fi

  # The self-hostable browser build. Same bundle deploy.yml publishes to Pages,
  # packaged so a site can serve it from its own intranet instead.
  #
  # This is not a convenience copy of the Pages version: there is no service
  # worker in the bundle, so "works offline" on the hosted app rests entirely on
  # HTTP cache — a hard refresh, an evicted cache or a fresh profile all need
  # github.io again. A fab that blocks external internet cannot reach it even
  # once. Self-hosting is therefore the only dependable browser-based offline
  # option, and the only one for sites that will not send lot data off-site.
  #
  # Nothing needs building differently: vite already emits the web app with
  # `base: './'`, so the bundle is relative-path and works from any subdirectory
  # (verified serving it from /tools/tsmap/), and it requests no external origin.
  web-bundle:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: build:web -> prebuild:web -> check-testdata-parser-published.js
      # needs git log on packages/parsers/ to detect crate drift, exactly as in
      # deploy.yml. A shallow clone makes that check silently pass.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build:web

      # The offline cache is silent when it breaks: workbox skips an oversized
      # file without failing the build, so a published app can install fine and
      # then be unable to parse anything offline. Checked here rather than in
      # `npm run verify`, which has no dist/ to look at.
      - name: Check the offline cache
        run: npm run check:pwa

      - name: Package the bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="tsmap-web-${VERSION}"
          # A top-level directory inside the zip, so unpacking it in a web root
          # does not splatter assets/ and index.html across whatever is there.
          mkdir -p "$DIR"
          cp -r dist/* "$DIR"/
          cp .github/assets/web-bundle-README.txt "$DIR/README.txt"
          sed -i "s/VERSION/${VERSION}/g" "$DIR/README.txt"
          zip -qr "tsmap-${VERSION}-web.zip" "$DIR"
          gh release upload "$GITHUB_REF_NAME" "tsmap-${VERSION}-web.zip" \
            --clobber --repo "$GITHUB_REPOSITORY"

  # NOTE: a native RHEL 8/9 build is deliberately NOT provided. Investigated and
  # rejected (2026-06-22): RHEL 8 ships glib 2.56 and RHEL 9 ships glib 2.68, both
  # below the >= 2.70 that the gtk-rs `gobject-sys` crate requires — the el8 build
  # fails outright. el9 compiles but the artifact links webkit2gtk-4.1 / libsoup-3.0
  # (neither packaged on el9, which only has the 4.0 ABI) and demands GLIBC_2.39
  # (el9 has 2.34), so it cannot launch there. RHEL users are pointed to the web
  # build instead. Revisit on RHEL 10 (glibc 2.39, webkit-4.1 available).
