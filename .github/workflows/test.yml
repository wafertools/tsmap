name: Test

on:
  # No `push` trigger: deploy.yml runs on every push to main and calls this, so a
  # push trigger here only ran the same suite twice in parallel on one commit.
  pull_request:
    branches: [main]
  # Reusable: build.yml and deploy.yml call this so releases/deploys are gated on it.
  workflow_call:
    inputs:
      # The Rust steps run once per commit. A release pushes the commit to main (deploy.yml, with Rust) and tags it
      # (build.yml, which skips them here and compiles the whole app for every platform anyway).
      skip_rust:
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.skip_rust != true

      - uses: Swatinem/rust-cache@v2
        if: inputs.skip_rust != true

      - name: Install Linux dependencies
        if: inputs.skip_rust != true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # public/guide/ is generated (gitignored) and no longer required for the
      # type check (nothing in src/ imports it) — this step is a smoke check
      # that the guide build itself doesn't error, not a typecheck dependency.
      - name: Build user guide
        run: npm run build:guide

      - name: Type check (TypeScript)
        run: npm run check

      - name: Lint
        run: npm run lint

      # Prose drifts silently — a stale architecture tree type-checks and tests
      # green forever. See scripts/check-architecture-docs.mjs.
      - name: Check docs against the code
        run: npm run check:docs

      - name: Unit tests (JS)
        run: npm test

      # An unset input (a pull request) is null, which GitHub's expressions compare equal to false, so the flag is "skip", not "run".
      #
      # `cargo test --workspace` builds src-tauri as well, so a separate `cargo check` would compile the same crates a second
      # time. CI's own cargo settings (see .github/cargo-ci.toml) keep the dependencies unoptimised.
      #
      # The fingerprint log names why cargo rebuilt a crate it should have found in the cache (a full cache match once still
      # compiled 637 crates); the next step prints the first few reasons.
      - name: Tests (Rust)
        if: inputs.skip_rust != true
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          set -o pipefail
          npm run test:rust -- --config .github/cargo-ci.toml 2>&1 | tee cargo-fingerprint.log

      - name: Why cargo rebuilt
        if: always() && inputs.skip_rust != true
        run: grep -i -m 25 "dirty\|stale\|fingerprint error" cargo-fingerprint.log || echo "nothing was rebuilt for a stated reason"
