[project]
site_name   = "tsmap"
site_url    = "https://wafertools.github.io/tsmap/"
site_author = "Paul Robins"
repo_url    = "https://github.com/wafertools/tsmap"

nav = [
  { "Home"        = "index.md"       },
  { "Features"    = "features.md"    },
  { "Use cases"   = "use-cases.md"   },
  { "User guide"  = "user-guide.md"  },
  { "Web app"     = "web.md"         },
  { "Parser API"  = "parser-api.md"  },
  { "Development" = "development.md" },
]

[project.theme]
favicon = "images/tsmap-favicon.ico"
logo    = "images/tsmap-readme-header-256.png"
features = [
  "navigation.tabs",
  "content.code.copy",
]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true
