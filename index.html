<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tsmap</title>
    <!-- Pre-rendered, not a live-scaled inline SVG: at favicon size (16-32px)
         the wafer-glyph's stroke widths (authored for a 1024-unit source)
         scale down to sub-pixel values that browsers barely render — found
         by testing the equivalent inline SVG at 64px (see the empty-state
         icon in main.ts, which needed its strokes bumped for exactly this
         reason). The official exports don't have that risk: each size was
         rasterized directly, not scaled live. -->
    <link rel="icon" href="/tsmap-favicon.ico" sizes="any" />
    <link rel="icon" href="/tsmap-favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/tsmap-favicon-16.png" type="image/png" sizes="16x16" />
    <script type="module" src="/src/main.ts" defer></script>
    <script>
      // Last-resort visibility for a module that fails to load/parse — at that
      // point main.ts never runs, so the log panel doesn't exist and the window
      // is the only surface left to report on.
      //
      // Deliberately narrow. An earlier version rewrote the title on ANY window
      // error event, which meant wmap's ResizeObserver emitting the benign
      // "ResizeObserver loop completed with undelivered notifications" notice
      // during an ordinary window resize permanently retitled the app (browser
      // tab on web, OS window title + taskbar entry on desktop) to
      // "ERR: …" — reading, to a user, as a crash. Two guards now:
      //   - `e.filename` must be set: script errors carry a source URL,
      //     ResizeObserver notices and resource-load failures do not.
      //   - only fires before main.ts has signalled it booted.
      window.addEventListener('error', e => {
        console.error('module error', e);
        if (!e.filename || window.__tsmapBooted) return;
        document.title = 'ERR: ' + e.message;
      });
    </script>
    <style>
      /* ── THEMING ──────────────────────────────────────────────────────────
         Colours are chosen by a `data-theme` attribute on <html> (set by
         src/theme.ts from a toolbar picker + localStorage). Four modes:
           (no attribute) = "Auto"  → dark by default, light via the OS media
                                       query block at the very end.
           [data-theme="dark"]       → force dark
           [data-theme="light"]      → force light
           [data-theme="light-green"]→ light with a green (#8DC63F) accent
         Each block below defines ONLY the colour tokens. The theme-independent
         tokens (z-scale, --wmap-* chrome mappings) live in the shared `:root`
         block further down and are never duplicated per theme. */

      /* Colour token set — DARK (also the Auto default). Dark grey, not
         near-black (VS-Code-dark range); surface hierarchy toolbar darkest →
         app → overlay → input/modal lightest. */
      :root,
      :root[data-theme="dark"] {
        /* Force native form-control chrome (the closed <select> box, inputs) to
           match the active theme, not the OS — inherited by all controls. NB:
           the OPEN <select> popup is native GTK chrome on Linux WebKitGTK and
           ignores this, following the desktop theme (a platform limitation). */
        color-scheme: dark;
        --bg-app:          #2e2e31;
        --bg-toolbar:      #262628;
        --bg-overlay:      #2a2a2d;
        --bg-input:        #37373b;
        --bg-hover-row:    #343438;
        --bg-row-border:   #3a3a3e;
        --bg-modal:        #37373b;
        --bg-accent-hover: #2b3a4f;

        --border-strong:   #333;
        /* --border-mid is the default border for buttons/inputs/dropdowns/
           modals (35+ call sites, incl. --wmap-border below — the wafer
           map's own toolbar inherits it too) — it needs to actually be
           visible, unlike --border-strong above (2 call sites, deliberately
           subtle structural dividers, left alone). The old value (#3a3a3a)
           measured 1.04-1.25:1 contrast against this theme's own
           backgrounds — essentially invisible, not a "subtle" choice, a
           bug. #808080 clears WCAG 1.4.11's 3:1 non-text-contrast minimum
           against every surface this token actually sits on here (bg-app,
           bg-modal, bg-overlay) — found and fixed 2026-08. Same bug existed
           in nord and solarized-dark (their own --border-mid, below) —
           fixed the same way, hue-matched to each theme's own palette
           rather than reusing this grey. Not touched: light-theme
           --border-mid values, which don't have this problem (darkening
           text/borders against a light background naturally increases
           contrast; the bug is specific to lightening against a dark one). */
        --border-mid:      #808080;
        --border-subtle:   #2a2a2a;
        --border-muted:    #444;
        --border-dim:      #555;

        --text-primary:    #eee;
        --text-secondary:  #ccc;
        --text-tertiary:   #aaa;
        --text-muted:      #888;
        /* text-dim/faint/veryfaint measured 1.4-2.4:1 contrast against this
           theme's own backgrounds — below WCAG AA's 4.5:1 (normal text) even
           for the LARGE-text 3:1 floor in most cases. Same class of bug as
           --border-mid above (lightening tokens weren't lightened enough
           for a dark background), confirmed by the "Supports STDF, ATDF…"
           empty-state subtitle (text-veryfaint) being reported unreadable.
           Fixed 2026-08, same hue-preserving-lighten approach, target
           ~4.5-5.0:1 against every background these actually render on
           (bg-app/bg-modal/bg-overlay). The three values compress closer
           together than before — full readability took priority over a
           wide subtlety gradient, per explicit direction. Same bug existed
           in nord and solarized-dark, fixed the same way below. */
        --text-dim:        #a9a9a9;
        --text-faint:      #a4a4a4;
        --text-veryfaint:  #a0a0a0;
        --text-subdued:    #999;
        --text-light:      #ddd;
        --text-lighter:    #bbb;
        --text-white:      #fff;

        --accent:          #6af;
        --btn-primary-bg:  #1a5aad;
        --btn-primary-hover: #2068cc;

        --warn-bg:         #2a1f00;
        --warn-text:       #fa7;
        --warn-border:     #3a2a00;
        --warn-btn-bg:     #7a3a00;
        --warn-btn-hover:  #9a4a00;
        --info-bg:         #0f1f2a;
        --info-text:       #6af;
        --info-border:     #1a3a4a;
        --ok-text:         #4a8;
        --error-text:      #f87;
        --error-bg:        #2a1212;
        --error-border:    #3a1f1f;
      }

      /* Colour token set — LIGHT. Shared by explicit light mode and, via the
         media query at the end, by Auto mode on a light OS. Emitted as a mixin
         through a placeholder: we duplicate it into the two selectors that need
         it (explicit + auto-media) to avoid a build step. */
      :root[data-theme="light"] {
        color-scheme: light;
        --bg-app:          #f0f0f0;
        --bg-toolbar:      #e4e4e4;
        --bg-overlay:      #f5f5f5;
        --bg-input:        #fff;
        --bg-hover-row:    #ebebeb;
        --bg-row-border:   #e8e8e8;
        --bg-modal:        #fff;
        --bg-accent-hover: #dbeafe;

        --border-strong:   #ccc;
        --border-mid:      #bbb;
        --border-subtle:   #d8d8d8;
        --border-muted:    #bbb;
        --border-dim:      #aaa;

        --text-primary:    #111;
        --text-secondary:  #333;
        --text-tertiary:   #444;
        --text-muted:      #666;
        --text-dim:        #888;
        --text-faint:      #999;
        --text-veryfaint:  #aaa;
        --text-subdued:    #555;
        --text-light:      #222;
        --text-lighter:    #444;
        --text-white:      #fff;

        --accent:          #1a6bbf;
        --btn-primary-bg:  #1a5aad;
        --btn-primary-hover: #1450a0;

        --warn-bg:         #fff8e1;
        --warn-text:       #92400e;
        --warn-border:     #fcd34d;
        --warn-btn-bg:     #b45309;
        --warn-btn-hover:  #92400e;
        --info-bg:         #eff6ff;
        --info-text:       #1d4ed8;
        --info-border:     #bfdbfe;
        --ok-text:         #166534;
        --error-text:      #b91c1c;
        --error-bg:        #fef2f2;
        --error-border:    #fecaca;
      }

      /* Colour token set — LIGHT GREEN. Light surfaces with a subtle green
         tint, #8DC63F as the accent (active/selected states, links, primary
         buttons, focus/active chrome), and a deep navy (#192136) as the
         secondary accent-hover. Dark #2a2a2a text on near-white for legibility. */
      :root[data-theme="light-green"] {
        color-scheme: light;
        --bg-app:          #f4f8ee;   /* faintest green-grey app canvas */
        --bg-toolbar:      #e8f0dc;   /* slightly greener toolbar */
        --bg-overlay:      #f7fbf1;   /* panels/cards */
        --bg-input:        #ffffff;
        --bg-hover-row:    #eef5e2;   /* pale green hover */
        --bg-row-border:   #e4eed4;
        --bg-modal:        #ffffff;
        --bg-accent-hover: #e2f0cc;   /* green-tinted selection */

        --border-strong:   #c2d3a8;
        --border-mid:      #cfe0b5;
        --border-subtle:   #e0ead0;
        --border-muted:    #c2d3a8;
        --border-dim:      #b3c795;

        --text-primary:    #1c2412;   /* near-black with a green-brown warmth */
        --text-secondary:  #2a3320;
        --text-tertiary:   #3f4a30;
        --text-muted:      #5f6b4c;
        --text-dim:        #7d886a;
        --text-faint:      #97a186;
        --text-veryfaint:  #b3bca4;
        --text-subdued:    #4a5638;
        --text-light:      #222a16;
        --text-lighter:    #3f4a30;
        --text-white:      #fff;

        --accent:          #6fa62e;   /* #8DC63F darkened for AA contrast on light */
        --btn-primary-bg:  #7ab52f;
        --btn-primary-hover: #6fa62e;
        /* White-on-#7ab52f measures only 2.48:1 (see CLAUDE.md's Theming
           section) — this theme's own dark text passes at 6.47:1 instead. */
        --btn-primary-text: #1c2412;

        --warn-bg:         #fff8e1;
        --warn-text:       #92400e;
        --warn-border:     #fcd34d;
        --warn-btn-bg:     #b45309;
        --warn-btn-hover:  #92400e;
        --info-bg:         #ecf5dc;   /* green-tinted info */
        --info-text:       #4d6b1f;
        --info-border:     #cfe0b5;
        --ok-text:         #4d7a1f;
        --error-text:      #b91c1c;
        --error-bg:        #fef2f2;
        --error-border:    #fecaca;
      }

      /* Colour token set — NORD (dark). Cool arctic blue-grey (Polar Night
         #2e3440 → #3b4252 → #434c5e) with a frost-cyan accent (#88c0d0) and
         Snow-Storm text (#eceff4 → #d8dee9). Calm, low-contrast dark. */
      :root[data-theme="nord"] {
        color-scheme: dark;
        --bg-app:          #2e3440;
        --bg-toolbar:      #2b303b;
        --bg-overlay:      #323846;
        --bg-input:        #3b4252;
        --bg-hover-row:    #3b4252;
        --bg-row-border:   #434c5e;
        --bg-modal:        #3b4252;
        --bg-accent-hover: #3b4a58;

        --border-strong:   #4c566a;
        --border-mid:      #808da5;
        --border-subtle:   #3b4252;
        --border-muted:    #4c566a;
        --border-dim:      #616e88;

        --text-primary:    #eceff4;
        --text-secondary:  #e5e9f0;
        --text-tertiary:   #d8dee9;
        --text-muted:      #a6adbb;
        /* see the dark theme's own --text-dim/faint/veryfaint comment above
           — same bug, same fix, hue-matched to nord's palette. */
        --text-dim:        #b2b7c1;
        --text-faint:      #a9b2c2;
        --text-veryfaint:  #a5aebe;
        --text-subdued:    #c0c6d2;
        --text-light:      #e5e9f0;
        --text-lighter:    #c0c6d2;
        --text-white:      #fff;

        --accent:          #88c0d0;
        --btn-primary-bg:  #5e81ac;
        --btn-primary-hover: #81a1c1;
        /* White-on-#5e81ac measures only 4.03:1, below AA's 4.5:1 — black
           passes at 5.21:1 instead. */
        --btn-primary-text: #000;

        --warn-bg:         #3b352a;
        --warn-text:       #ebcb8b;
        --warn-border:     #4a3f2a;
        --warn-btn-bg:     #a3862f;
        --warn-btn-hover:  #b8973a;
        --info-bg:         #2b3a44;
        --info-text:       #88c0d0;
        --info-border:     #3b4a58;
        --ok-text:         #a3be8c;
        /* Nord's own aurora red (nord11, #bf616a) measures only 3.05:1 against
           this theme's own app background — below WCAG AA's 4.5:1 for text,
           and it's used as bare text (log-error, mapping-validation, the
           reset-button hover state), not only inside a coloured banner where a
           lower bar might be excusable. Lightened along the same hue toward
           white until it clears AA against every surface it's actually shown
           on (app 4.54:1, toolbar 4.80:1) — still legibly "Nord red", not a
           different colour. */
        --error-text:      #cf898f;
        --error-bg:        #3a2a2c;
        --error-border:    #4a3236;
      }

      /* Colour token set — SOLARIZED DARK (Ethan Schoonover). Warm teal-dark
         base (#002b36 / #073642), blue-grey text (#839496 / #93a1a1), blue
         accent (#268bd2). The classic designed palette. */
      :root[data-theme="solarized-dark"] {
        color-scheme: dark;
        --bg-app:          #002b36;
        --bg-toolbar:      #00252e;
        --bg-overlay:      #073642;
        --bg-input:        #073642;
        --bg-hover-row:    #0a3d4a;
        --bg-row-border:   #0e4653;
        --bg-modal:        #073642;
        --bg-accent-hover: #0a3f52;

        --border-strong:   #12586b;
        --border-mid:      #647e85;
        --border-subtle:   #073642;
        --border-muted:    #12586b;
        --border-dim:      #586e75;

        --text-primary:    #fdf6e3;
        --text-secondary:  #93a1a1;
        --text-tertiary:   #839496;
        --text-muted:      #657b83;
        /* see the dark theme's own --text-dim/faint/veryfaint comment above
           — same bug, same fix, hue-matched to solarized-dark's palette. */
        --text-dim:        #90a4ab;
        --text-faint:      #87a0a8;
        --text-veryfaint:  #819da4;
        --text-subdued:    #839496;
        --text-light:      #eee8d5;
        --text-lighter:    #93a1a1;
        --text-white:      #fdf6e3;

        --accent:          #268bd2;
        --btn-primary-bg:  #268bd2;
        --btn-primary-hover: #2aa198;
        /* White-on-#268bd2 measures only 3.68:1, below AA's 4.5:1 — black
           passes at 5.71:1 instead. */
        --btn-primary-text: #000;

        --warn-bg:         #33321a;
        --warn-text:       #b58900;
        --warn-border:     #4a4520;
        --warn-btn-bg:     #b58900;
        --warn-btn-hover:  #c99a10;
        --info-bg:         #003847;
        --info-text:       #268bd2;
        --info-border:     #0e4653;
        --ok-text:         #859900;
        /* Solarized's published red (dc322f) is tuned to Solarized's own
           perceptual-lightness spec, not WCAG contrast — it measures 3.25:1
           against base03 (this theme's app background), under the 4.5:1 AA
           floor for the bare text this token is used as (log-error,
           mapping-validation, reset-button hover). Lightened toward base3
           along the same hue until it clears AA everywhere it's shown
           (app 4.82:1, toolbar 5.17:1) while staying recognisably Solarized
           red rather than switching families. */
        --error-text:      #e66d65;
        --error-bg:        #331d1c;
        --error-border:    #4a2624;
      }

      /* Colour token set — SOLARIZED LIGHT. Cream base (#fdf6e3 / #eee8d5),
         same blue-grey text family, blue accent (#268bd2). Pairs with the dark. */
      :root[data-theme="solarized-light"] {
        color-scheme: light;
        --bg-app:          #fdf6e3;
        --bg-toolbar:      #f2ecd8;
        --bg-overlay:      #fdf6e3;
        --bg-input:        #fffcf0;
        --bg-hover-row:    #eee8d5;
        --bg-row-border:   #e6dfc8;
        --bg-modal:        #fffcf0;
        --bg-accent-hover: #e3ecdf;

        --border-strong:   #d3cbb0;
        --border-mid:      #ded7bd;
        --border-subtle:   #eee8d5;
        --border-muted:    #d3cbb0;
        --border-dim:      #b6ad92;

        --text-primary:    #073642;
        --text-secondary:  #586e75;
        --text-tertiary:   #657b83;
        --text-muted:      #839496;
        --text-dim:        #93a1a1;
        --text-faint:      #a7b2ad;
        --text-veryfaint:  #bcc4bd;
        --text-subdued:    #657b83;
        --text-light:      #073642;
        --text-lighter:    #586e75;
        --text-white:      #fff;

        --accent:          #268bd2;
        --btn-primary-bg:  #268bd2;
        --btn-primary-hover: #2076b5;
        /* White-on-#268bd2 measures only 3.68:1, below AA's 4.5:1 — black
           passes at 5.71:1 instead. */
        --btn-primary-text: #000;

        --warn-bg:         #faf3d8;
        --warn-text:       #93700a;
        --warn-border:     #e6d99a;
        --warn-btn-bg:     #b58900;
        --warn-btn-hover:  #93700a;
        --info-bg:         #e8f0f6;
        --info-text:       #1a6ba8;
        --info-border:     #c4dbec;
        --ok-text:         #5a7300;
        --error-text:      #cb2b28;
        --error-bg:        #fbeae6;
        --error-border:    #f0c4ba;
      }

      /* Colour token set — HIGH CONTRAST (light). Pure white surfaces, near-black
         text, a strong saturated blue accent. For bright rooms / projectors /
         accessibility — maximum legibility, not subtlety. */
      :root[data-theme="high-contrast"] {
        color-scheme: light;
        --bg-app:          #ffffff;
        --bg-toolbar:      #f2f2f2;
        --bg-overlay:      #ffffff;
        --bg-input:        #ffffff;
        --bg-hover-row:    #eaeaea;
        --bg-row-border:   #d0d0d0;
        --bg-modal:        #ffffff;
        --bg-accent-hover: #d6e4ff;

        --border-strong:   #666;
        --border-mid:      #999;
        --border-subtle:   #bbb;
        --border-muted:    #888;
        --border-dim:      #666;

        --text-primary:    #000000;
        --text-secondary:  #111;
        --text-tertiary:   #222;
        --text-muted:      #444;
        --text-dim:        #555;
        --text-faint:      #666;
        --text-veryfaint:  #888;
        --text-subdued:    #333;
        --text-light:      #000;
        --text-lighter:    #222;
        --text-white:      #fff;

        --accent:          #0050c8;
        --btn-primary-bg:  #0050c8;
        --btn-primary-hover: #003ea0;

        --warn-bg:         #fff4d6;
        --warn-text:       #7a4b00;
        --warn-border:     #e0b84d;
        --warn-btn-bg:     #8a5300;
        --warn-btn-hover:  #7a4b00;
        --info-bg:         #e0edff;
        --info-text:       #0050c8;
        --info-border:     #9cc0ff;
        --ok-text:         #0a6b1e;
        --error-text:      #c50000;
        --error-bg:        #ffe8e8;
        --error-border:    #f5b8b8;
      }

      /* AUTO mode on a light OS: only when no explicit theme is set. Mirrors the
         light token set above (kept in sync by hand — small, rarely changes). */
      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
          color-scheme: light;
          --bg-app:          #f0f0f0;
          --bg-toolbar:      #e4e4e4;
          --bg-overlay:      #f5f5f5;
          --bg-input:        #fff;
          --bg-hover-row:    #ebebeb;
          --bg-row-border:   #e8e8e8;
          --bg-modal:        #fff;
          --bg-accent-hover: #dbeafe;

          --border-strong:   #ccc;
          --border-mid:      #bbb;
          --border-subtle:   #d8d8d8;
          --border-muted:    #bbb;
          --border-dim:      #aaa;

          --text-primary:    #111;
          --text-secondary:  #333;
          --text-tertiary:   #444;
          --text-muted:      #666;
          --text-dim:        #888;
          --text-faint:      #999;
          --text-veryfaint:  #aaa;
          --text-subdued:    #555;
          --text-light:      #222;
          --text-lighter:    #444;
          --text-white:      #fff;

          --accent:          #1a6bbf;
          --btn-primary-bg:  #1a5aad;
          --btn-primary-hover: #1450a0;

          --warn-bg:         #fff8e1;
          --warn-text:       #92400e;
          --warn-border:     #fcd34d;
          --warn-btn-bg:     #b45309;
          --warn-btn-hover:  #92400e;
          --info-bg:         #eff6ff;
          --info-text:       #1d4ed8;
          --info-border:     #bfdbfe;
          --ok-text:         #166534;
          --error-text:      #b91c1c;
          --error-bg:        #fef2f2;
          --error-border:    #fecaca;
        }
      }

      /* ── Theme-independent tokens (defined once, apply to every theme) ──── */
      :root {
        /* Stacking order. tsmap's overlays layer against wmap's map-toolbar
           overlays (--wmap-z, default 6000, +2). Single source of truth; every
           overlay references a tier (CSS var() / JS cssVar) — no bare numbers.
             --z-modal    every full-screen tsmap overlay/modal (clears 6000–6002)
             --z-tooltip  shared hover tooltip (above modals)
           There used to be a lower --z-overlay tier for "pre-render-only" form
           overlays (mapping, rename, test selector) on the theory that nothing
           else could be rendered yet. That was wrong three times over: "Add
           files" reuses the SAME mapping/rename/test-selector overlays to
           append to an ALREADY-rendered gallery, so they'd render invisibly
           behind wmap's own toolbar. There is no such thing as a page-level
           overlay in this app that is structurally guaranteed to never appear
           over a rendered map — always use --z-modal for a new one. See
           WMAP_ISSUES.md #22/#23. */
        --z-modal:    7000;
        --z-tooltip:  7100;

        /* Filled-button text colour, paired with --btn-primary-bg (see the
           Theming section of CLAUDE.md). Defaults to white, since that's
           correct for most themes' button ground; a theme whose
           --btn-primary-bg is too light for white to clear AA overrides this
           inside its own :root[data-theme="…"] block (light-green, nord,
           solarized-dark, solarized-light all do). */
        --btn-primary-text: var(--text-white);

        /* wmap chrome theming (WMAP_ISSUES #25): wmap reads its toolbar / panel /
           canvas colours from these --wmap-* tokens (the full list is wmap's own
           `WMAP_TOKEN_NAMES`, packages/canvas-adapter/toolbar.ts). Mapping them
           to tsmap's own --var tokens makes the embedded wafer map follow
           whatever theme is active — the values below resolve against the
           active colour block above, so no per-theme --wmap-* duplication is
           needed.

           This list previously mapped 20 of wmap's 26 tokens and silently
           dropped the rest — a real bug, not a deliberate scope cut: a token
           wmap reads but tsmap never sets doesn't go unstyled, it falls back to
           wmap's OWN hardcoded light-theme default (canvasTheme.ts's `read(name,
           fallback)`), because that's what makes wmap usable in a host that sets
           no theme at all. The missing one that actually bit: `--wmap-text-strong`
           (wmap's `CLR.value`, used for the Summary panel's headings and big
           stat numbers — summaryPanel.ts's `VALUE_COLOR`) fell back to wmap's
           near-black `#1f2f43` on every dark theme, landing near-black text on
           near-black panel backgrounds — under 1.1:1 contrast, functionally
           invisible. `--wmap-err-*` and `--wmap-finding-indicator` had the same
           gap, just not yet exercised by anything the dark-theme testing here
           happened to trigger. `--wmap-z` is the one token deliberately still
           left unmapped: it's wmap's own toolbar-overlay z-index band (default
           6000), and tsmap's --z-modal/--z-tooltip scale is defined ABOVE it on
           purpose (see the block below) rather than substituted for it. */
        --wmap-canvas-bg:   var(--bg-app);
        --wmap-surface:     var(--bg-overlay);
        --wmap-panel-bg:    var(--bg-app);
        --wmap-border:      var(--border-mid);
        --wmap-text:        var(--text-secondary);
        --wmap-text-muted:  var(--text-muted);
        --wmap-text-strong: var(--text-primary);
        --wmap-icon:        var(--text-tertiary);
        /* Hover + active affordances use the theme ACCENT (green in Light green,
           blue in dark/light), matching tsmap's own toolbar buttons — this is
           what makes the accent actually show in the embedded map chrome, not
           just on the rare active icon. */
        --wmap-icon-hover:  var(--accent);
        --wmap-icon-active: var(--accent);
        --wmap-bg-hover:    var(--bg-accent-hover);
        --wmap-bg-active:   var(--bg-accent-hover);
        --wmap-menu-hover:  var(--bg-accent-hover);
        --wmap-menu-active: var(--bg-accent-hover);
        --wmap-separator:   var(--border-subtle);
        --wmap-warn-bg:     var(--warn-bg);
        --wmap-warn-border: var(--warn-border);
        --wmap-warn-text:   var(--warn-text);
        --wmap-err-bg:      var(--error-bg);
        --wmap-err-border:  var(--error-border);
        --wmap-err-text:    var(--error-text);
        --wmap-info-bg:     var(--info-bg);
        --wmap-info-text:   var(--info-text);
        /* Selected-card outline follows the theme accent (was a fixed orange
           that fought the green/Solarized palettes). */
        --wmap-selected:    var(--accent);
        /* The toolbar-button "this wafer/lot has notable findings" text
           indicator — an attention cue, not an error state, so it takes the
           warning token rather than the error one. */
        --wmap-finding-indicator: var(--warn-text);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Keyboard focus ─────────────────────────────────────────────────
         One global rule, deliberately not scoped to a class. Most of tsmap's
         controls are built in JS with inline `style` (help-menu rows, recent
         rows, every button in the Splits dialog and test selector) — none of
         them set `outline`, so a bare element rule reaches all of them without
         each having to opt in. Before this the app defined NO focus styling at
         all and fell back to the UA ring, which on the dark themes renders a
         near-black outline against near-black chrome. UI_STANDARDS.md (WCAG
         2.4.7) requires a visible focus indicator on exactly these hand-rolled
         widget classes.

         :focus-visible, not :focus — mouse clicks shouldn't leave a ring.
         The outer box-shadow gives a light "halo" so the accent stays visible
         against surfaces that happen to be close to it in tone. */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 3px;
        box-shadow: 0 0 0 4px var(--bg-accent-hover);
      }
      /* Overlay panels take focus programmatically so Esc and screen-reader
         navigation land inside them; that's a scripted move, not a keyboard
         journey, so it shouldn't paint a ring around the whole dialog. */
      .mapping-panel:focus-visible, [role="dialog"]:focus-visible {
        outline: none; box-shadow: none;
      }

      /* Checkbox/radio fill follows the theme accent (otherwise the browser
         renders its default blue regardless of theme). The `color-scheme` on the
         theme :root blocks themes the CLOSED <select> box and inputs; the OPEN
         <select> popup is native GTK chrome on the Linux WebView and follows the
         desktop theme (uncontrollable by CSS) — same as the OS file dialog. */
      input[type="checkbox"], input[type="radio"] {
        accent-color: var(--accent);
      }

      html, body {
        width: 100%; height: 100%;
        background: var(--bg-app); color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      #app { display: flex; flex-direction: column; height: 100%; }

      /* Toolbar overflow policy. The right-hand group (theme picker, Help) used
         to be pushed clean off the viewport below ~900px — not clipped-with-a-
         scrollbar but unreachable, because the row had neither wrap nor
         overflow. Three graduated defences, cheapest first:
           1. the decorative bits (#drop-hint, then #toolbar-title) drop out at
              breakpoints — they carry no function the rest of the bar doesn't;
           2. #file-label already shrinks to nothing (flex-shrink:1;min-width:0);
           3. overflow-x:auto is the hard floor — at any width too narrow for
              even the buttons alone, the bar scrolls rather than hiding
              controls. Deliberately NOT flex-wrap: a second toolbar row would
              resize #map-container and force wmap to re-layout the canvas. */
      #toolbar {
        display: flex; align-items: center; gap: 12px;
        padding: 6px 12px; background: var(--bg-toolbar); border-bottom: 1px solid var(--border-strong);
        font-size: 13px; flex-shrink: 0;
        overflow-x: auto; scrollbar-width: thin;
      }
      /* The right-hand group must never be the thing that scrolls out of view,
         so it can't shrink; everything to its left yields first. */
      #theme-select, #help-btn { flex-shrink: 0; }
      #toolbar-title { font-weight: 600; color: var(--text-secondary); margin-right: 4px; }
      @media (max-width: 1100px) { #drop-hint { display: none; } }
      @media (max-width: 700px)  { #toolbar-title { display: none; } }

      /* The dashed frame doubles as a drop target hint. Both of its promises are
         now actually wired in main.ts: clicking the frame (not just the button
         inside it) opens the picker, and `.drag-over` is applied on dragenter —
         previously the class was styled here but never added by any code, and
         the cursor:pointer margin was inert. */
      #drop-zone {
        display: flex; align-items: center; gap: 8px;
        padding: 4px 10px; border: 1px dashed var(--border-muted); border-radius: 4px;
        cursor: pointer; transition: border-color 0.15s, background 0.15s;
      }
      #drop-zone:hover, #drop-zone.drag-over { border-color: var(--accent); background: var(--bg-accent-hover); }
      #drop-zone.drag-over { border-style: solid; }
      /* Toolbar buttons are styled by CLASS, never by an enumerated ID list.
         The previous `#filter-tests-btn, #value-findings-btn, #splits-btn,
         #recent-btn { … }` pair of rules had to be extended by hand for every
         new button, in two places (base + :hover) — and #die-list-btn was
         added without either, so it rendered with raw browser-default chrome
         and, missing white-space:nowrap, wrapped its label mid-word. Exactly
         the "two copies of a rule is the bug" case: a class means any new
         toolbar button is correctly styled by construction. Only genuinely
         different COLOUR intents get a modifier below. */
      .tb-btn {
        background: none; border: 1px solid var(--border-dim); border-radius: 4px;
        color: var(--text-muted); font-size: 12px; padding: 3px 10px; cursor: pointer;
        white-space: nowrap; user-select: none;
      }
      .tb-btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); background: var(--bg-accent-hover); }
      .tb-btn:disabled { opacity: 0.4; cursor: default; }
      /* Primary (the one entry action) — accent-outlined at rest, not just on hover. */
      .tb-btn--primary { border-color: var(--accent); color: var(--accent); }
      /* Destructive — neutral at rest, error-coloured only on hover, so it never
         shouts for attention but does confirm intent before the click lands. */
      .tb-btn--danger { border-color: var(--border-muted); }
      .tb-btn--danger:not(:disabled):hover { border-color: var(--error-text); color: var(--error-text); background: none; }
      #recent-btn { display: inline-flex; align-items: center; gap: 5px; }
      /* Group divider. Toggled with the group it frames (setToolbarGroupVisible,
         main.ts) — a divider with nothing beside it reads as a rendering bug. */
      .tb-sep { width: 1px; align-self: stretch; margin: 3px 2px; background: var(--border-dim); flex-shrink: 0; }
      .tb-caret { opacity: 0.7; font-size: 10px; }
      /* The checkbox glyph carries the on/off state so the button reads as a toggle, not a nav link. */
      #value-findings-btn .vf-box::before { content: '\2610'; margin-right: 5px; }      /* ☐ off */
      #value-findings-btn.active { border-color: var(--accent); color: var(--accent); background: var(--bg-accent-hover); }
      #value-findings-btn.active .vf-box::before { content: '\2611'; }                  /* ☑ on */
      #drop-hint { white-space: nowrap; flex-shrink: 0; }
      #file-label {
        font-size: 12px; color: var(--text-muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        min-width: 0; flex-shrink: 1;
      }
      #busy-spinner {
        display: none; width: 13px; height: 13px; border-radius: 50%;
        border: 2px solid var(--border-dim); border-top-color: var(--accent);
      }
      #busy-spinner.active {
        display: inline-block;
        animation: tsmap-spin 0.7s linear infinite;
      }
      @keyframes tsmap-spin { to { transform: rotate(360deg); } }

      #map-container { flex: 1; min-height: 0; min-width: 0; position: relative; overflow: hidden; }
      #map-container.gallery { overflow-y: auto; }

      /* ── Mapping overlay ───────────────────────────────────────── */
      #tsmap-mapping-overlay {
        position: fixed; inset: 0; z-index: var(--z-modal);
        background: var(--bg-overlay); display: flex; flex-direction: column;
        overflow: hidden;
      }
      .mapping-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; font-size: 13px; }
      .mapping-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 16px; border-bottom: 1px solid var(--border-strong); flex-shrink: 0;
      }
      .mapping-title { font-weight: 600; font-size: 14px; color: var(--text-light); }
      .mapping-file-info { font-size: 12px; color: var(--text-dim); }
      /* Filter + bulk-assign strip. A wide CSV can carry a hundred-plus columns
         (105 in the bundled fixture), which previously meant a hundred-plus
         individual dropdowns with no search and no way back to auto-detection
         once a mapping had been saved for that header set. Mirrors the controls
         the test selector — the sibling overlay in the same flow — already had. */
      .mapping-tools {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        padding: 8px 16px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
      }
      .mapping-tools input[type="search"] {
        flex: 1; min-width: 160px; max-width: 320px;
        background: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: 4px 8px; border-radius: 4px; font-size: 12px;
      }
      .mapping-tools .tool-btn {
        background: none; border: 1px solid var(--border-mid); border-radius: 4px;
        color: var(--text-secondary); font-size: 12px; padding: 4px 10px; cursor: pointer;
        white-space: nowrap;
      }
      .mapping-tools .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
      .mapping-tools .tool-sep { margin-left: auto; }
      .mapping-tools .tool-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
      .mapping-scroll { flex: 1; overflow-y: auto; padding: 0 8px; }
      /* Rows hidden by the filter — display:none rather than removal so
         readMapping() still sees every row's select and nothing a filtered-out
         column was assigned is silently dropped on Continue. */
      .mapping-table tr[hidden] { display: none; }
      .mapping-table { width: 100%; border-collapse: collapse; }
      .mapping-table th { text-align: left; padding: 6px 8px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; background: var(--bg-overlay); }
      .mapping-table td { padding: 4px 8px; border-bottom: 1px solid var(--bg-row-border); vertical-align: middle; }
      .mapping-table tr:hover td { background: var(--bg-hover-row); }
      .col-name { font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace; color: var(--text-tertiary); white-space: nowrap; }
      .col-arrow { color: var(--text-veryfaint); text-align: center; }
      /* `appearance:none` strips the native dropdown arrow, which left the Role
         selects rendering as plain bordered boxes — pixel-identical to the
         real text inputs in the adjacent "Test name" column, so nothing told
         the user which column was a dropdown. The caret is drawn with two
         linear-gradients rather than an SVG data URI specifically so it can
         take `var(--text-muted)` and follow the theme; a data-URI SVG can't
         read a CSS custom property. `padding-right` keeps long option labels
         from running underneath it. */
      .mapping-table select {
        background-color: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: 2px 22px 2px 4px; border-radius: 3px; font-size: 12px; width: 100%;
        -webkit-appearance: none; appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
          linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
        background-position: calc(100% - 13px) center, calc(100% - 9px) center;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
      }
      .mapping-table select:hover { border-color: var(--border-dim); }
      .mapping-table select option {
        background: var(--bg-input); color: var(--text-secondary);
      }
      /* Role cell holds the select plus an optional numeric/string
         type-mismatch hint (Parquet's typed columns only — CSV/JSON never set
         it) — flex so the fixed-width icon doesn't force the select to wrap. */
      .role-cell { display: flex; align-items: center; gap: 4px; }
      .role-cell select { flex: 1; width: auto; min-width: 0; }
      .type-mismatch-hint { color: var(--warn-text); font-size: 13px; flex-shrink: 0; cursor: help; }
      .test-name-input {
        background: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: 2px 6px; border-radius: 3px; font-size: 12px; width: 180px;
      }
      .split-cell { white-space: nowrap; }
      .split-label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-muted); font-size: 12px; }
      .cardinality-hint { color: var(--text-faint); font-size: 12px; }
      .mapping-footer {
        display: flex; align-items: center; gap: 12px; padding: 10px 16px;
        border-top: 1px solid var(--border-strong); flex-shrink: 0; background: var(--bg-toolbar);
        justify-content: flex-end;
      }
      /* Sized to hold the duplicate-role message, which names every clashing
         column and so can run long — it must wrap rather than squeeze the
         footer's buttons off the row. */
      .mapping-validation { font-size: 12px; color: var(--error-text); max-width: 46ch; line-height: 1.4; }
      .mapping-validation:empty { display: none; }
      .pass-bin-group { display: flex; align-items: center; gap: 6px; margin-right: auto; font-size: 12px; color: var(--text-muted); }
      .pass-bin-group input { background: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary); padding: 2px 6px; border-radius: 3px; font-size: 12px; width: 80px; }
      .btn-primary { background: var(--btn-primary-bg); border: none; color: var(--btn-primary-text); padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
      .btn-primary:hover { background: var(--btn-primary-hover); }
      .btn-secondary { background: none; border: 1px solid var(--border-muted); color: var(--text-muted); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
      .btn-secondary:hover { border-color: var(--border-dim); color: var(--text-lighter); }

      /* Rename overlay — reuses mapping-panel styles */
      #tsmap-rename-overlay {
        position: fixed; inset: 0; z-index: var(--z-modal);
        background: var(--bg-overlay); display: flex; flex-direction: column;
        overflow: hidden;
      }
      .rename-file { font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace; color: var(--text-muted); font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rename-arrow { color: var(--text-veryfaint); text-align: center; padding: 0 8px; }
      .rename-input {
        background: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: 3px 8px; border-radius: 3px; font-size: 13px; width: 200px;
      }
      .rename-count { color: var(--text-faint); font-size: 12px; padding-left: 12px; }

      /* Append confirmation */
      .append-summary { margin-bottom: 14px; font-size: 13px; color: var(--text-tertiary); }
      .append-warnings { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
      .append-warning { display: flex; gap: 8px; font-size: 12px; padding: 6px 10px; border-radius: 4px; }
      .append-warn { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
      .append-info { background: var(--info-bg); color: var(--info-text); border: 1px solid var(--info-border); }
      .warn-icon { flex-shrink: 0; }
      .append-ok { font-size: 12px; color: var(--ok-text); margin-bottom: 18px; }
      .btn-warn { background: var(--warn-btn-bg) !important; }
      .btn-warn:hover { background: var(--warn-btn-hover) !important; }

      /* Long-format modal + user-guide modal (both use this backdrop).
         --z-modal clears wmap's overlay band (see the scale in :root). */
      .tsmap-modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: var(--z-modal);
        display: flex; align-items: center; justify-content: center;
      }
      .tsmap-modal {
        background: var(--bg-modal); border: 1px solid var(--border-mid); border-radius: 6px;
        padding: 24px; max-width: 420px; color: var(--text-light);
      }
      .tsmap-modal h3 { margin-bottom: 10px; font-size: 15px; }
      .tsmap-modal p  { margin-bottom: 20px; font-size: 13px; color: var(--text-subdued); line-height: 1.5; }
      .tsmap-modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
      .muted { color: var(--text-faint); font-size: 12px; }

      /* The append confirmation renders INSIDE openModal's box, which already
         draws the surface, border, radius and title bar — so the .tsmap-modal
         chrome it shares with the standalone dialogs has to be stripped back to
         padding alone, or it paints a second card inside the first.
         Written as `.tsmap-modal.append-modal` deliberately: a bare
         `.append-modal` ties on specificity with `.tsmap-modal` above and would
         lose on source order, which is exactly how the double card appeared. */
      .tsmap-modal.append-modal {
        background: none; border: none; border-radius: 0;
        max-width: none; width: 100%; padding: 16px 18px 18px;
      }
      .tsmap-modal.append-modal .append-warnings { margin-bottom: 16px; }
      .tsmap-modal.append-modal .append-summary { margin-bottom: 12px; }

      /* ── Help button + modal ───────────────────────────────────────── */
      #help-btn {
        background: none; border: none;
        color: var(--text-muted);
        padding: 0; cursor: pointer; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #help-btn:hover { color: var(--accent); }

      /* ── Log panel ─────────────────────────────────────────────── */
      #log-bar {
        flex-shrink: 0; background: var(--bg-toolbar); border-top: 1px solid var(--border-strong);
      }
      #log-toggle {
        width: 100%; background: none; border: none; border-bottom: 1px solid transparent;
        color: var(--text-dim); font-size: 12px; padding: 3px 12px;
        cursor: pointer; user-select: none;
        display: flex; align-items: center; justify-content: flex-end; gap: 6px;
      }
      #log-toggle:hover { color: var(--text-tertiary); }
      /* Chevron indicates the panel can be opened/closed; rotates when open. */
      #log-toggle::after {
        content: ''; width: 7px; height: 7px;
        border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
        transform: rotate(-135deg); transition: transform 0.15s; margin-bottom: -2px;
      }
      #log-toggle[aria-expanded="true"]::after { transform: rotate(45deg); margin-bottom: 2px; }
      #log-panel {
        display: none; height: 120px; overflow-y: auto;
        padding: 4px 12px 6px;
      }
      #log-panel.open { display: block; border-top: 1px solid var(--border-subtle); }
      .log-entry {
        font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace;
        font-size: 12px; line-height: 1.6;
        white-space: pre-wrap; word-break: break-all;
        color: var(--text-muted);
      }
      .log-error { color: var(--error-text); }
      .log-warn  { color: var(--warn-text); }
      .log-info  { color: var(--text-muted); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <span id="toolbar-title">tsmap</span>
        <div id="drop-zone" title="Open wafer-map files — or drop them anywhere">
          <button id="open-btn" class="tb-btn tb-btn--primary" title="Open wafer-map files — or drop them anywhere">Open files</button>
          <input id="file-input" type="file" multiple
            accept=".stdf,.std,.atdf,.atd,.csv,.json,.parquet,.gz,.zip,.txt,.dat"
            style="display:none" />
        </div>
        <button id="filter-files-btn" class="tb-btn" title="Scan many files for lot/wafer metadata, then filter and select which to load">Filter files…</button>
        <button id="add-btn" class="tb-btn" disabled title="Append more files to the current view">Add files</button>
        <button id="recent-btn" class="tb-btn" style="display:none" title="Recently opened files"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg> Recent</button>
        <span class="tb-sep" style="display:none"></span>
        <button id="lot-btn" class="tb-btn" style="display:none" aria-haspopup="menu" aria-expanded="false"
          title="Filter tests, wafer splits, and the lot-wide die list">Lot <span class="tb-caret">▾</span></button>
        <button id="value-findings-btn" class="tb-btn" role="switch" style="display:none" aria-checked="false"><span class="vf-box"></span>Value findings</button>
        <span class="tb-sep" style="display:none"></span>
        <button id="reset-btn" class="tb-btn tb-btn--danger" style="display:none" title="Unload all files and reset">Clear</button>
        <span id="drop-hint">or drop a file anywhere</span>
