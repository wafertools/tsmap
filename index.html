<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tsmap</title>
    <!-- Pre-rendered, not a live-scaled inline SVG: at favicon size (16-32px)
         the wafer-glyph's stroke widths (authored for a 1024-unit source)
         scale down to sub-pixel values that browsers barely render — found
         by testing the equivalent inline SVG at 64px (see the empty-state
         icon in main.ts, which needed its strokes bumped for exactly this
         reason). The official exports don't have that risk: each size was
         rasterized directly, not scaled live. -->
    <link rel="icon" href="/tsmap-favicon.ico" sizes="any" />
    <link rel="icon" href="/tsmap-favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/tsmap-favicon-16.png" type="image/png" sizes="16x16" />
    <script type="module" src="/src/main.ts" defer></script>
    <script>
      // Last-resort visibility for a module that fails to load/parse — at that
      // point main.ts never runs, so the log panel doesn't exist and the window
      // is the only surface left to report on.
      //
      // Deliberately narrow. An earlier version rewrote the title on ANY window
      // error event, which meant wmap's ResizeObserver emitting the benign
      // "ResizeObserver loop completed with undelivered notifications" notice
      // during an ordinary window resize permanently retitled the app (browser
      // tab on web, OS window title + taskbar entry on desktop) to
      // "ERR: …" — reading, to a user, as a crash. Two guards now:
      //   - `e.filename` must be set: script errors carry a source URL,
      //     ResizeObserver notices and resource-load failures do not.
      //   - only fires before main.ts has signalled it booted.
      window.addEventListener('error', e => {
        console.error('module error', e);
        if (!e.filename || window.__tsmapBooted) return;
        document.title = 'ERR: ' + e.message;
      });
    </script>
    <style>
      /* ── THEMING ──────────────────────────────────────────────────────────
         Colours are chosen by a `data-theme` attribute on <html> (set by
         src/theme.ts from a toolbar picker + localStorage). Four modes:
           (no attribute) = "Auto"  → dark by default, light via the OS media
                                       query block at the very end.
           [data-theme="dark"]       → force dark
           [data-theme="light"]      → force light
           [data-theme="light-green"]→ light with a green (#8DC63F) accent
         Each block below defines ONLY the colour tokens. The theme-independent
         tokens (z-scale, --wmap-* chrome mappings) live in the shared `:root`
         block further down and are never duplicated per theme. */

      /* Colour token set — DARK (also the Auto default). Dark grey, not
         near-black (VS-Code-dark range); surface hierarchy toolbar darkest →
         app → overlay → input lightest.

         There was a `--bg-modal` too, one step lighter again, on the theory
         that a dialog is a raised surface. It never described the app: every
         real dialog (`openModal` — splits, definitions, file filter, geometry),
         every menu and the filter table all painted `--bg-overlay`, and only
         the test selector and the plain confirm dialog used it — so those two
         read as a different shade sitting beside the others. Removed rather
         than rolled out, because rolling it out would also have split the
         wafer map's own panel (`--wmap-surface` → `--bg-overlay`) away from the
         dialog hosting it. If the raised-dialog idea is ever wanted, it has to
         move that bridge too. */
      :root,
      :root[data-theme="dark"] {
        /* Force native form-control chrome (the closed <select> box, inputs) to
           match the active theme, not the OS — inherited by all controls. NB:
           the OPEN <select> popup is native GTK chrome on Linux WebKitGTK and
           ignores this, following the desktop theme (a platform limitation). */
        color-scheme: dark;
        --bg-app:          #2e2e31;
        --bg-toolbar:      #262628;
        --bg-overlay:      #2a2a2d;
        --bg-input:        #37373b;
        --bg-hover-row:    #343438;
        --bg-row-border:   #3a3a3e;
        --bg-accent-hover: #2b3a4f;
        --bg-selected:     #3a4b64;

        --border-strong:   #333;
        /* --border-mid is the default border for buttons/inputs/dropdowns/
           modals (35+ call sites, incl. --wmap-border below — the wafer
           map's own toolbar inherits it too) — it needs to actually be
           visible, unlike --border-strong above (2 call sites, deliberately
           subtle structural dividers, left alone). The old value (#3a3a3a)
           measured 1.04-1.25:1 contrast against this theme's own
           backgrounds — essentially invisible, not a "subtle" choice, a
           bug. #808080 clears WCAG 1.4.11's 3:1 non-text-contrast minimum
           against every surface this token actually sits on here (bg-app,
           bg-overlay) — found and fixed 2026-08. Same bug existed
           in nord and solarized-dark (their own --border-mid, below) —
           fixed the same way, hue-matched to each theme's own palette
           rather than reusing this grey. Not touched: light-theme
           --border-mid values, which don't have this problem (darkening
           text/borders against a light background naturally increases
           contrast; the bug is specific to lightening against a dark one). */
        --border-mid:      #808080;
        --border-subtle:   #2a2a2a;
        --border-muted:    #444;
        --border-dim:      #555;

        --text-primary:    #eee;
        --text-secondary:  #ccc;
        --text-tertiary:   #aaa;
        --text-muted:      #888;
        /* text-dim/faint/veryfaint measured 1.4-2.4:1 contrast against this
           theme's own backgrounds — below WCAG AA's 4.5:1 (normal text) even
           for the LARGE-text 3:1 floor in most cases. Same class of bug as
           --border-mid above (lightening tokens weren't lightened enough
           for a dark background), confirmed by the "Supports STDF, ATDF…"
           empty-state subtitle (text-veryfaint) being reported unreadable.
           Fixed 2026-08, same hue-preserving-lighten approach, target
           ~4.5-5.0:1 against every background these actually render on
           (bg-app/bg-overlay). The three values compress closer
           together than before — full readability took priority over a
           wide subtlety gradient, per explicit direction. Same bug existed
           in nord and solarized-dark, fixed the same way below. */
        --text-dim:        #a9a9a9;
        --text-faint:      #a4a4a4;
        --text-veryfaint:  #a0a0a0;
        --text-subdued:    #999;
        --text-light:      #ddd;
        --text-lighter:    #bbb;
        --text-white:      #fff;

        --accent:          #6af;
        --btn-primary-bg:  #1a5aad;
        --btn-primary-hover: #2068cc;

        --warn-bg:         #2a1f00;
        --warn-text:       #fa7;
        --warn-border:     #3a2a00;
        --warn-btn-bg:     #7a3a00;
        --warn-btn-hover:  #9a4a00;
        --info-bg:         #0f1f2a;
        --info-text:       #6af;
        --info-border:     #1a3a4a;
        --ok-text:         #4a8;
        --error-text:      #f87;
        --error-bg:        #2a1212;
        --error-border:    #3a1f1f;
      }

      /* Colour token set — LIGHT. Shared by explicit light mode and, via the
         media query at the end, by Auto mode on a light OS. Emitted as a mixin
         through a placeholder: we duplicate it into the two selectors that need
         it (explicit + auto-media) to avoid a build step. */
      :root[data-theme="light"] {
        color-scheme: light;
        --bg-app:          #f0f0f0;
        --bg-toolbar:      #e4e4e4;
        --bg-overlay:      #f5f5f5;
        --bg-input:        #fff;
        --bg-hover-row:    #ebebeb;
        --bg-row-border:   #e8e8e8;
        --bg-accent-hover: #dbeafe;
        --bg-selected:     #bcd1e7;

        --border-strong:   #ccc;
        --border-mid:      #bbb;
        --border-subtle:   #d8d8d8;
        --border-muted:    #bbb;
        --border-dim:      #aaa;

        --text-primary:    #111;
        --text-secondary:  #333;
        --text-tertiary:   #444;
        --text-muted:      #666;
        --text-dim:        #888;
        --text-faint:      #999;
        --text-veryfaint:  #aaa;
        --text-subdued:    #555;
        --text-light:      #222;
        --text-lighter:    #444;
        --text-white:      #fff;

        --accent:          #1865b4;   /* darkened from #1a6bbf: as text on --bg-toolbar it measured 4.24:1, under AA */
        --btn-primary-bg:  #1a5aad;
        --btn-primary-hover: #1450a0;

        --warn-bg:         #fff8e1;
        --warn-text:       #92400e;
        --warn-border:     #fcd34d;
        --warn-btn-bg:     #b45309;
        --warn-btn-hover:  #92400e;
        --info-bg:         #eff6ff;
        --info-text:       #1d4ed8;
        --info-border:     #bfdbfe;
        --ok-text:         #166534;
        --error-text:      #b91c1c;
        --error-bg:        #fef2f2;
        --error-border:    #fecaca;
      }

      /* Colour token set — LIGHT GREEN. Modelled on a real green+navy brand
         (#8DC63F primary accent, #489636 as its own darker hover shade,
         #192136 deep navy, #3A3A3A/#54595F neutral greys, #0C4186 blue) —
         reproduced here as an unnamed inspiration, not a literal reskin.
         Surfaces are neutral white/grey (that brand uses colour only as an
         accent on white, never a tinted background wash); #8DC63F is the
         accent/button colour with its own #489636 as the hover shade, navy
         doubles as the near-black heading/primary-text colour instead of
         plain black, and blue is reserved for the info/secondary semantic —
         mirroring how that brand keeps a separate blue family for form
         chrome, distinct from its green CTAs. Previous version of this
         theme tinted every surface pale green and invented its own accent
         and hover colours, several of which measured well under WCAG AA
         (border-mid 1.30:1, accent-as-text 2.72:1, text-veryfaint 1.83:1
         against its own app background) — this rewrite fixes both the
         inauthenticity and the contrast failures at once. */
      :root[data-theme="light-green"] {
        color-scheme: light;
        --bg-app:          #fafafa;
        --bg-toolbar:      #f0f0f0;
        --bg-overlay:      #ffffff;
        --bg-input:        #ffffff;
        --bg-hover-row:    #f0f0f0;
        --bg-row-border:   #eaeaea;
        --bg-accent-hover: #e8f5d9;
        --bg-selected:     #c9d9c5;   /* pale tint of the #8DC63F accent */

        --border-strong:   #cccccc;
        --border-mid:      #8a8a8a;
        --border-subtle:   #e0e0e0;
        --border-muted:    #c8c8c8;
        --border-dim:      #a0a0a0;

        --text-primary:    #192136;   /* the brand's own navy, standing in for near-black */
        --text-secondary:  #3a3a3a;   /* the brand's own body-text grey */
        --text-tertiary:   #54595f;   /* the brand's own secondary grey */
        --text-muted:      #6b6f75;
        --text-dim:        #707478;
        --text-faint:      #6b6f73;
        --text-veryfaint:  #65696d;
        --text-subdued:    #55595e;
        --text-light:      #192136;
        --text-lighter:    #4a4e52;
        --text-white:      #fff;

        --accent:          #2e6e1f;   /* the brand's own darker green shade — clears AA as bare text where #8DC63F itself (2.04:1) can't */
        --btn-primary-bg:  #8dc63f;
        --btn-primary-hover: #489636; /* the brand's own hover shade for this exact accent */
        /* White fails on both (#fff/#8dc63f 2.04:1, #fff/#489636 3.69:1) —
           black clears AA against both instead (10.28:1 / 5.69:1), and is
           also one of the brand's own palette colours. */
        --btn-primary-text: #000;

        --warn-bg:         #fff8e1;
        --warn-text:       #92400e;
        --warn-border:     #fcd34d;
        --warn-btn-bg:     #b45309;
        --warn-btn-hover:  #92400e;
        --info-bg:         #eaf1fb;   /* the brand keeps a separate blue family for form/info chrome, apart from its green CTAs */
        --info-text:       #0c4186;
        --info-border:     #b8d0ea;
        --ok-text:         #2e6e1f;
        --error-text:      #b91c1c;
        --error-bg:        #fef2f2;
        --error-border:    #fecaca;
      }

      /* Colour token set — NORD (dark). Cool arctic blue-grey (Polar Night
         #2e3440 → #3b4252 → #434c5e) with a frost-cyan accent (#88c0d0) and
         Snow-Storm text (#eceff4 → #d8dee9). Calm, low-contrast dark. */
      :root[data-theme="nord"] {
        color-scheme: dark;
        --bg-app:          #2e3440;
        --bg-toolbar:      #2b303b;
        --bg-overlay:      #323846;
        --bg-input:        #3b4252;
        --bg-hover-row:    #3b4252;
        --bg-row-border:   #434c5e;
        --bg-accent-hover: #3b4a58;
        --bg-selected:     #485b6a;

        --border-strong:   #4c566a;
        --border-mid:      #808da5;
        --border-subtle:   #3b4252;
        --border-muted:    #4c566a;
        --border-dim:      #616e88;

        --text-primary:    #eceff4;
        --text-secondary:  #e5e9f0;
        --text-tertiary:   #d8dee9;
        --text-muted:      #a6adbb;
        /* see the dark theme's own --text-dim/faint/veryfaint comment above
           — same bug, same fix, hue-matched to nord's palette. */
        --text-dim:        #b2b7c1;
        --text-faint:      #a9b2c2;
        --text-veryfaint:  #a5aebe;
        --text-subdued:    #c0c6d2;
        --text-light:      #e5e9f0;
        --text-lighter:    #c0c6d2;
        --text-white:      #fff;

        --accent:          #88c0d0;
        --btn-primary-bg:  #5e81ac;
        --btn-primary-hover: #81a1c1;
        /* White-on-#5e81ac measures only 4.03:1, below AA's 4.5:1 — black
           passes at 5.21:1 instead. */
        --btn-primary-text: #000;

        --warn-bg:         #3b352a;
        --warn-text:       #ebcb8b;
        --warn-border:     #4a3f2a;
        --warn-btn-bg:     #a3862f;
        --warn-btn-hover:  #b8973a;
        --info-bg:         #2b3a44;
        --info-text:       #88c0d0;
        --info-border:     #3b4a58;
        --ok-text:         #a3be8c;
        /* Nord's own aurora red (nord11, #bf616a) measures only 3.05:1 against
           this theme's own app background — below WCAG AA's 4.5:1 for text,
           and it's used as bare text (log-error, mapping-validation, the
           reset-button hover state), not only inside a coloured banner where a
           lower bar might be excusable. Lightened along the same hue toward
           white until it clears AA against every surface it's actually shown
           on (app 4.54:1, toolbar 4.80:1) — still legibly "Nord red", not a
           different colour. */
        --error-text:      #cf898f;
        --error-bg:        #3a2a2c;
        --error-border:    #4a3236;
      }

      /* Colour token set — DRACULA. Deep purple-grey base (#282a36 / #343646),
         off-white foreground (#f8f8f2), purple accent (#bd93f9) with its own
         signature pink/cyan/green family for the semantic colours. */
      :root[data-theme="dracula"] {
        color-scheme: dark;
        --bg-app:          #282a36;
        --bg-toolbar:      #21222c;
        --bg-overlay:      #2b2d3a;
        --bg-input:        #343646;
        --bg-hover-row:    #343646;
        --bg-row-border:   #3b3d4d;
        --bg-accent-hover: #3a3355;
        --bg-selected:     #51486c;

        --border-strong:   #44475a;
        --border-mid:      #7a7f9a;
        --border-subtle:   #343646;
        --border-muted:    #4a4d5f;
        --border-dim:      #565a6e;

        --text-primary:    #f8f8f2;
        --text-secondary:  #e6e6e0;
        --text-tertiary:   #d0d0ce;
        --text-muted:      #a8a8b3;
        --text-dim:        #a8acc0;
        --text-faint:      #9ea2b8;
        --text-veryfaint:  #9ca0b6;
        --text-subdued:    #c0c0c8;
        --text-light:      #f0f0ec;
        --text-lighter:    #d6d6d2;
        --text-white:      #fff;

        --accent:          #bd93f9;
        --btn-primary-bg:  #6b4fbb;
        --btn-primary-hover: #7c5cd1;

        --warn-bg:         #3a2e12;
        --warn-text:       #ffb86c;
        --warn-border:     #4a3a18;
        --warn-btn-bg:     #96580c;
        --warn-btn-hover:  #a8630f;
        --info-bg:         #13323a;
        --info-text:       #8be9fd;
        --info-border:     #1f4a54;
        --ok-text:         #50fa7b;
        --error-text:      #ff5555;
        --error-bg:        #3a1414;
        --error-border:    #4a1f1f;
      }

      /* Colour token set — TOKYO NIGHT. Cool blue-purple dark base
         (#1a1b26 / #292e42), blue accent (#7aa2f7), magenta/cyan/green family
         for the semantic colours. */
      :root[data-theme="tokyo-night"] {
        color-scheme: dark;
        --bg-app:          #1a1b26;
        --bg-toolbar:      #16161e;
        --bg-overlay:      #1f2335;
        --bg-input:        #292e42;
        --bg-hover-row:    #292e42;
        --bg-row-border:   #34395a;
        --bg-accent-hover: #263457;
        --bg-selected:     #374467;

        --border-strong:   #3b4261;
        --border-mid:      #7c84a8;
        --border-subtle:   #1f2335;
        --border-muted:    #414868;
        --border-dim:      #545c7e;

        --text-primary:    #c0caf5;
        --text-secondary:  #b7c1ea;
        --text-tertiary:   #a9b1d6;
        --text-muted:      #7982a9;
        --text-dim:        #a3aacb;
        --text-faint:      #959cbe;
        --text-veryfaint:  #8f97ba;
        --text-subdued:    #8992b8;
        --text-light:      #cdd6f9;
        --text-lighter:    #aab1d9;
        --text-white:      #fff;

        --accent:          #7aa2f7;
        --btn-primary-bg:  #446dc7;
        --btn-primary-hover: #4a63a8;

        --warn-bg:         #362f1c;
        --warn-text:       #e0af68;
        --warn-border:     #4a3f22;
        --warn-btn-bg:     #86611f;
        --warn-btn-hover:  #96701f;
        --info-bg:         #16232f;
        --info-text:       #7dcfff;
        --info-border:     #223447;
        --ok-text:         #9ece6a;
        --error-text:      #f7768e;
        --error-bg:        #34191f;
        --error-border:    #452530;

      /* Colour token set — GITHUB DARK. Near-black base (#0d1117 / #161b22),
         blue accent (#58a6ff) matching GitHub's own UI. */
      :root[data-theme="github-dark"] {
        color-scheme: dark;
        --bg-app:          #0d1117;
        --bg-toolbar:      #010409;
        --bg-overlay:      #161b22;
        --bg-input:        #161b22;
        --bg-hover-row:    #161b22;
        --bg-row-border:   #21262d;
        --bg-accent-hover: #1c2b41;
        --bg-selected:     #273f5b;

        --border-strong:   #30363d;
        --border-mid:      #6e7681;
        --border-subtle:   #21262d;
        --border-muted:    #30363d;
        --border-dim:      #484f58;

        --text-primary:    #e6edf3;
        --text-secondary:  #c9d1d9;
        --text-tertiary:   #b1bac4;
        --text-muted:      #8b949e;
        --text-dim:        #9aa2ac;
        --text-faint:      #8f97a1;
        --text-veryfaint:  #848c96;
        --text-subdued:    #9198a1;
        --text-light:      #d0d7de;
        --text-lighter:    #b1bac4;

        --accent:          #58a6ff;
        --btn-primary-bg:  #1f6feb;

        --warn-bg:         #2b2111;

        --warn-border:     #3a2e14;
        --warn-btn-bg:     #9e6a03;
        --warn-btn-hover:  #8a5c02;
        --info-bg:         #0d2036;
        --info-text:       #58a6ff;
        --info-border:     #1c3a5e;

      /* Colour token set — GRUVBOX DARK. Warm, retro-contrast dark base
         (#282828 / #3c3836), orange accent (#fe8019), earthy red/green/yellow

      :root[data-theme="gruvbox-dark"] {
        color-scheme: dark;

        --text-muted:      #a89984;

      /* Colour token set — CATPPUCCIN MOCHA. Soft dark base (#1e1e2e /
         #313244), mauve accent (#cba6f7), pastel red/green/yellow/blue family
         for the semantic colours. */
      :root[data-theme="catppuccin-mocha"] {
        color-scheme: dark;
        --bg-app:          #1e1e2e;
        --bg-toolbar:      #181825;
        --bg-overlay:      #232336;

      /* ── Theme-independent tokens (defined once, apply to every theme) ──── */
      :root {
        /* Corner radius as three roles, not a spread of near-identical values.
           Was 3/4/6/8/10px chosen per element — see UI_STANDARDS.md "Radius". */
        --radius-control:   4px;   /* buttons, inputs, menu rows, toggles */
        --radius-container: 6px;   /* cards, panels, menus, modals */
        --radius-pill:      999px; /* badges, chips, count pills */

        /* Spacing scale — every padding, gap and margin should be one of these.
           Derived from the values already in use, not imposed: they clustered
           at 2/4/6/8/10/12/16/24 with a thin tail of one-off values, and the
           clusters are the scale. See UI_STANDARDS.md "Spacing". */
        --space-xxs:  2px;
        --space-xs:   4px;
        --space-sm:   6px;
        --space-md:   8px;
        --space-lg:  10px;
        --space-xl:  12px;
        --space-xxl: 16px;
        --space-xxxl:24px;

        /* Elevation. Fourteen distinct box-shadow literals existed across both
           repos with no rule for which belonged where. Three tiers is what the
           values actually clustered into. */
        --shadow-panel: 0 1px 4px rgba(0,0,0,0.10);
        --shadow-menu:  0 4px 12px rgba(0,0,0,0.15);
        --shadow-modal: 0 20px 60px rgba(0,0,0,0.40);

        /* Motion. One duration for state changes, one for movement the eye
           follows. Ten different transition literals is not expressiveness. */
        --motion-fast: 0.12s ease;
        --motion-base: 0.2s ease;

        /* Line height, opacity, tracking — one value per job. */
        --leading-none:  1;
        --leading-tight: 1.2;
        --leading-base:  1.45;
        --alpha-muted:    0.85;
        --alpha-disabled: 0.4;
        --tracking:       0.05em;

        /* Stacking order. tsmap's overlays layer against wmap's map-toolbar
           overlays (--wmap-z, default 6000, +2). Single source of truth; every
           overlay references a tier (CSS var() / JS cssVar) — no bare numbers.
             --z-modal    every full-screen tsmap overlay/modal (clears 6000–6002)
             --z-tooltip  shared hover tooltip (above modals)
           There used to be a lower --z-overlay tier for "pre-render-only" form
           overlays (mapping, rename, test selector) on the theory that nothing
           else could be rendered yet. That was wrong three times over: "Add
           files" reuses the SAME mapping/rename/test-selector overlays to
           append to an ALREADY-rendered gallery, so they'd render invisibly
           behind wmap's own toolbar. There is no such thing as a page-level
           overlay in this app that is structurally guaranteed to never appear
           over a rendered map — always use --z-modal for a new one. See
           WMAP_ISSUES.md #22/#23. */
        --z-modal:    7000;
        --z-tooltip:  7100;

        /* Filled-button text colour, paired with --btn-primary-bg (see the
           Theming section of CLAUDE.md). Defaults to white, since that's
           correct for most themes' button ground; a theme whose
           --btn-primary-bg is too light for white to clear AA overrides this
           inside its own :root[data-theme="…"] block (light-green, nord,
           solarized-dark, solarized-light all do). */
        --btn-primary-text: var(--text-white);

        /* wmap chrome theming (WMAP_ISSUES #25): wmap reads its toolbar / panel /
           canvas colours from these --wmap-* tokens (the full list is wmap's own
           `WMAP_TOKEN_NAMES`, packages/canvas-adapter/toolbar.ts). Mapping them
           to tsmap's own --var tokens makes the embedded wafer map follow
           whatever theme is active — the values below resolve against the
           active colour block above, so no per-theme --wmap-* duplication is
           needed.

           This list previously mapped 20 of wmap's 26 tokens and silently
           dropped the rest — a real bug, not a deliberate scope cut: a token
           wmap reads but tsmap never sets doesn't go unstyled, it falls back to
           wmap's OWN hardcoded light-theme default (canvasTheme.ts's `read(name,
           fallback)`), because that's what makes wmap usable in a host that sets
           no theme at all. The missing one that actually bit: `--wmap-text-strong`
           (wmap's `CLR.value`, used for the Summary panel's headings and big
           stat numbers — summaryPanel.ts's `VALUE_COLOR`) fell back to wmap's
           near-black `#1f2f43` on every dark theme, landing near-black text on
           near-black panel backgrounds — under 1.1:1 contrast, functionally
           invisible. `--wmap-err-*` and `--wmap-finding-indicator` had the same
           gap, just not yet exercised by anything the dark-theme testing here
           happened to trigger. `--wmap-z` is the one token deliberately still
           left unmapped: it's wmap's own toolbar-overlay z-index band (default
           6000), and tsmap's --z-modal/--z-tooltip scale is defined ABOVE it on
           purpose (see the block below) rather than substituted for it. */
        /* wmap inherits the host's typeface rather than imposing its own — the
           library carried three different hardcoded stacks, none matching this
           one, so the same data in its panel and its Insights tables rendered in
           different faces. */
        --wmap-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --wmap-canvas-bg:   var(--bg-app);
        --wmap-surface:     var(--bg-overlay);
        --wmap-panel-bg:    var(--bg-app);
        --wmap-border:      var(--border-mid);
        --wmap-text:        var(--text-secondary);
        --wmap-text-muted:  var(--text-muted);
        --wmap-text-strong: var(--text-primary);
        --wmap-icon:        var(--text-tertiary);
        /* Hover + active affordances use the theme ACCENT (green in Light green,
           blue in dark/light), matching tsmap's own toolbar buttons — this is
           what makes the accent actually show in the embedded map chrome, not
           just on the rare active icon. */
        --wmap-icon-hover:  var(--accent);
        --wmap-icon-active: var(--accent);
        /* Hover and selected must NOT be the same value. All four of these
           mapped to --bg-accent-hover, so inside tsmap every wmap toolbar
           menu, dropdown row and option list rendered its hovered row and its
           selected row identically — the "three states, no fourth" rule in
           UI_STANDARDS.md collapsed to two. Hover is the transient neutral
           (--bg-hover-row, what tsmap's own anchoredMenu rows use); selected
           is the persistent accent tint. */
        --wmap-bg-hover:    var(--bg-hover-row);
        --wmap-bg-active:   var(--bg-selected);
        --wmap-menu-hover:  var(--bg-hover-row);
        --wmap-menu-active: var(--bg-selected);
        --wmap-separator:   var(--border-subtle);
        --wmap-warn-bg:     var(--warn-bg);
        --wmap-warn-border: var(--warn-border);
        --wmap-warn-text:   var(--warn-text);
        --wmap-err-bg:      var(--error-bg);
        --wmap-err-border:  var(--error-border);
        --wmap-err-text:    var(--error-text);
        --wmap-info-bg:     var(--info-bg);
        --wmap-info-text:   var(--info-text);
        /* Selected-card outline follows the theme accent (was a fixed orange
           that fought the green/Solarized palettes). */
        --wmap-selected:    var(--accent);
        /* The toolbar-button "this wafer/lot has notable findings" text
           indicator — an attention cue, not an error state, so it takes the
           warning token rather than the error one. */
        --wmap-finding-indicator: var(--warn-text);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Keyboard focus ─────────────────────────────────────────────────
         One global rule, deliberately not scoped to a class. Most of tsmap's
         controls are built in JS with inline `style` (help-menu rows, recent
         rows, every button in the Splits dialog and test selector) — none of
         them set `outline`, so a bare element rule reaches all of them without
         each having to opt in. Before this the app defined NO focus styling at
         all and fell back to the UA ring, which on the dark themes renders a
         near-black outline against near-black chrome. UI_STANDARDS.md (WCAG
         2.4.7) requires a visible focus indicator on exactly these hand-rolled
         widget classes.

         :focus-visible, not :focus — mouse clicks shouldn't leave a ring.
         The outer box-shadow gives a light "halo" so the accent stays visible
         against surfaces that happen to be close to it in tone. */
      /* Hover feedback for every button, by the same reasoning as the
         :focus-visible rule below: most of tsmap's controls are built in JS with
         inline styles and none of them opt in, so one unscoped element rule
         reaches all of them. Without it a bordered control is indistinguishable
         from a bordered label — it has the shape of a button and does nothing
         when you point at it. An audit found only 29% of tsmap's interactive
         elements had any hover affordance.

         Deliberately low specificity: `.tb-btn:hover` and `.btn-primary:hover`
         are class selectors and still win, so the toolbar keeps its accent
         treatment and this is only the floor. */
      /* `:where()` contributes ZERO specificity, so this whole selector is
         (0,1,1) and any component class beats it. Written as
         `button:not(:disabled):hover` it was (0,2,1) and outranked
         `.btn-primary:hover` (0,2,0) — every primary CTA lost its accent fill on
         hover, leaving white text on the hover grey at about 1.1:1 in the five
         themes that don't override --btn-primary-text. A floor must be
         unable to win. */
      button:where(:not(:disabled)):hover {
        background: var(--bg-hover-row);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: var(--radius-control);
        box-shadow: 0 0 0 4px var(--bg-accent-hover);
      }
      /* Overlay panels take focus programmatically so Esc and screen-reader
         navigation land inside them; that's a scripted move, not a keyboard
         journey, so it shouldn't paint a ring around the whole dialog. */
      .mapping-panel:focus-visible, [role="dialog"]:focus-visible {
        outline: none; box-shadow: none;
      }

      /* Checkbox/radio fill follows the theme accent (otherwise the browser
         renders its default blue regardless of theme). The `color-scheme` on the
         theme :root blocks themes the CLOSED <select> box and inputs; the OPEN
         <select> popup is native GTK chrome on the Linux WebView and follows the
         desktop theme (uncontrollable by CSS) — same as the OS file dialog. */
      input[type="checkbox"], input[type="radio"] {
        accent-color: var(--accent);
      }

      html, body {
        width: 100%; height: 100%;
        background: var(--bg-app); color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      #app { display: flex; flex-direction: column; height: 100%; }

      /* Toolbar overflow policy. The right-hand group (theme picker, Help) used
         to be pushed clean off the viewport below ~900px — not clipped-with-a-
         scrollbar but unreachable, because the row had neither wrap nor
         overflow. Three graduated defences, cheapest first:
           1. the decorative bits (#drop-hint, then #toolbar-title) drop out at
              breakpoints — they carry no function the rest of the bar doesn't;
           2. #file-label already shrinks to nothing (flex-shrink:1;min-width:0);
           3. overflow-x:auto is the hard floor — at any width too narrow for
              even the buttons alone, the bar scrolls rather than hiding
              controls. Deliberately NOT flex-wrap: a second toolbar row would
              resize #map-container and force wmap to re-layout the canvas. */
      #toolbar {
        display: flex; align-items: center; gap: 12px;
        padding: 6px 12px; background: var(--bg-toolbar); border-bottom: 1px solid var(--border-strong);
        font-size: 13px; flex-shrink: 0;
        overflow-x: auto; scrollbar-width: thin;
      }
      /* The right-hand group must never be the thing that scrolls out of view,
         so it can't shrink; everything to its left yields first. */
      #theme-select, #help-btn { flex-shrink: 0; }
      #toolbar-title { font-weight: 600; color: var(--text-secondary); margin-right: 4px; }
      @media (max-width: 1100px) { #drop-hint { display: none; } }
      @media (max-width: 700px)  { #toolbar-title { display: none; } }

      /* The dashed frame doubles as a drop target hint. Both of its promises are
         now actually wired in main.ts: clicking the frame (not just the button
         inside it) opens the picker, and `.drag-over` is applied on dragenter —
         previously the class was styled here but never added by any code, and
         the cursor:pointer margin was inert. */
      #drop-zone {
        display: flex; align-items: center; gap: 8px;
        padding: 4px 10px; border: 1px dashed var(--border-muted); border-radius: var(--radius-control);
        cursor: pointer; transition: border-color 0.15s, background 0.15s;
      }
      #drop-zone:hover, #drop-zone.drag-over { border-color: var(--accent); background: var(--bg-accent-hover); }
      #drop-zone.drag-over { border-style: solid; }
      /* Toolbar buttons are styled by CLASS, never by an enumerated ID list.
         The previous `#filter-tests-btn, #value-findings-btn, #splits-btn,
         #recent-btn { … }` pair of rules (that last id is long gone) had to be
         extended by hand for every
         new button, in two places (base + :hover) — and #die-list-btn was
         added without either, so it rendered with raw browser-default chrome
         and, missing white-space:nowrap, wrapped its label mid-word. Exactly
         the "two copies of a rule is the bug" case: a class means any new
         toolbar button is correctly styled by construction. Only genuinely
         different COLOUR intents get a modifier below. */
      .tb-btn {
        background: none; border: 1px solid var(--border-dim); border-radius: var(--radius-control);
        color: var(--text-muted); font-size: 12px; padding: 4px 10px; cursor: pointer;
        white-space: nowrap; user-select: none;
      }
      /* Accent border + accent text is the affordance; the ground stays NEUTRAL.
         On --bg-accent-hover this was accent-on-accent-tint, measuring 4.41 and
         4.42 in Light and Catppuccin Latte — under AA. Same pairing rule as the
         selected menu row: a tint carries state, it does not also host text of
         its own hue. */
      .tb-btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover-row); }
      .tb-btn:disabled { opacity: 0.4; cursor: default; }
      /* Primary (the one entry action) — accent-outlined at rest, not just on hover. */
      .tb-btn--primary { border-color: var(--accent); color: var(--accent); }
      /* Destructive — neutral at rest, error-coloured only on hover, so it never
         shouts for attention but does confirm intent before the click lands. */
      .tb-btn--danger { border-color: var(--border-muted); }
      .tb-btn--danger:not(:disabled):hover { border-color: var(--error-text); color: var(--error-text); background: none; }
      /* Group divider. Toggled with the group it frames (setToolbarGroupVisible,
         main.ts) — a divider with nothing beside it reads as a rendering bug. */
      .tb-sep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--border-dim); flex-shrink: 0; }
      .tb-caret { opacity: 0.7; font-size: 12px; }
      /* Split button: the verb (Open/Add) and a caret that chooses HOW to pick
         files. Two real <button>s — a click target nested inside a button is
         invalid HTML and unreachable by keyboard — joined visually so they read
         as one control. The seam is a single shared border rather than two
         adjacent ones, which would render 2px thick. */
      .tb-split { display: inline-flex; align-items: stretch; }
      .tb-split > .tb-btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
      .tb-split > .tb-btn + .tb-btn {
        border-top-left-radius: 0; border-bottom-left-radius: 0;
        border-left: none; padding-left: var(--space-sm); padding-right: var(--space-sm);
      }
      .tb-split > .tb-btn + .tb-btn::before {
        content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
        border-left: 1px solid var(--border-dim);
      }
      .tb-split > .tb-btn + .tb-btn { position: relative; }
      #drop-hint { white-space: nowrap; flex-shrink: 0; }
      /* Shrinks to an ellipsis, but never below a width that can still show
         something. Without the floor it collapsed to a single character plus
         an ellipsis ("s…") at narrow widths — still occupying toolbar space,
         still holding a tooltip, conveying nothing. Below the floor the
         container query hides it outright and gives the space back. */
      #file-label {
        font-size: 12px; color: var(--text-muted);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        min-width: 9ch; flex-shrink: 1;
      }
      @media (max-width: 900px) { #file-label { display: none; } }
      #busy-spinner {
        display: none; width: 13px; height: 13px; border-radius: var(--radius-pill);
        border: 2px solid var(--border-dim); border-top-color: var(--accent);
      }
      #busy-spinner.active {
        display: inline-block;
        animation: tsmap-spin 0.7s linear infinite;
      }
      @keyframes tsmap-spin { to { transform: rotate(360deg); } }

      #map-container { flex: 1; min-height: 0; min-width: 0; position: relative; overflow: hidden; }
      #map-container.gallery { overflow-y: auto; }

      /* ── Mapping overlay ───────────────────────────────────────── */
      #tsmap-mapping-overlay {
        position: fixed; inset: 0; z-index: var(--z-modal);
        background: var(--bg-overlay); display: flex; flex-direction: column;
        overflow: hidden;
      }
      .mapping-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; font-size: 13px; }
      .mapping-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 16px; border-bottom: 1px solid var(--border-strong); flex-shrink: 0;
      }
      .mapping-title { font-weight: 600; font-size: 14px; color: var(--text-light); }
      .mapping-file-info { font-size: 12px; color: var(--text-dim); }
      /* Filter + bulk-assign strip. A wide CSV can carry a hundred-plus columns
         (105 in the bundled fixture), which previously meant a hundred-plus
         individual dropdowns with no search and no way back to auto-detection
         once a mapping had been saved for that header set. Mirrors the controls
         the test selector — the sibling overlay in the same flow — already had. */
      .mapping-tools {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        padding: 8px 16px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
      }
      .mapping-tools input[type="search"] {
        flex: 1; min-width: 160px; max-width: 320px;
        background: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: 4px 8px; border-radius: var(--radius-control); font-size: 12px;
      }
      /* `.tool-btn` used to live here — a fourth definition of the secondary
         button, identical to `.btn-secondary` in every property but padding.
         Being descendant-scoped to `.mapping-tools` it also silently failed to
         reach the one `.tool-btn` outside that row (the footer's "Load bin
         definitions…"), which rendered as an unstyled native button ignoring
         the theme. Both problems disappear with the class: the buttons now use
         `.btn-secondary` like every other secondary button in the app. What is
         left here is layout only, which is genuinely local to this row. */
      .mapping-tools .btn-secondary { white-space: nowrap; }
      .mapping-tools .tool-sep { margin-left: auto; }
      .mapping-tools .tool-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
      .mapping-scroll { flex: 1; overflow-y: auto; padding: 0 8px; }
      /* Rows hidden by the filter — display:none rather than removal so
         readMapping() still sees every row's select and nothing a filtered-out
         column was assigned is silently dropped on Continue. */
      .mapping-table tr[hidden] { display: none; }
      .mapping-table { width: 100%; border-collapse: collapse; }
      .mapping-table th { text-align: left; padding: 6px 8px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border-subtle); position: sticky; top: 0; background: var(--bg-overlay); }
      .mapping-table td { padding: 4px 8px; border-bottom: 1px solid var(--bg-row-border); vertical-align: middle; }
      .mapping-table tr:hover td { background: var(--bg-hover-row); }
      .col-name { font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace; color: var(--text-tertiary); white-space: nowrap; }
      .col-arrow { color: var(--text-veryfaint); text-align: center; }
      /* `appearance:none` strips the native dropdown arrow, which left the Role
         selects rendering as plain bordered boxes — pixel-identical to the
         real text inputs in the adjacent "Test name" column, so nothing told
         the user which column was a dropdown. The caret is drawn with two
         linear-gradients rather than an SVG data URI specifically so it can
         take `var(--text-muted)` and follow the theme; a data-URI SVG can't
         read a CSS custom property. `padding-right` keeps long option labels
         from running underneath it. */
      .mapping-table select {
        background-color: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: 2px 24px 2px 4px; border-radius: var(--radius-control); font-size: 12px; width: 100%;
        -webkit-appearance: none; appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
          linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
        background-position: calc(100% - 13px) center, calc(100% - 9px) center;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
      }
      .mapping-table select:hover { border-color: var(--border-dim); }
      .mapping-table select option {
        background: var(--bg-input); color: var(--text-secondary);
      }
      /* Role cell holds the select plus an optional numeric/string
         type-mismatch hint (Parquet's typed columns only — CSV/JSON never set
         it) — flex so the fixed-width icon doesn't force the select to wrap. */
      .role-cell { display: flex; align-items: center; gap: 4px; }
      .role-cell select { flex: 1; width: auto; min-width: 0; }
      .type-mismatch-hint { color: var(--warn-text); font-size: 13px; flex-shrink: 0; cursor: help; }
      .test-name-input {
        background: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: 2px 6px; border-radius: var(--radius-control); font-size: 12px; width: 180px;
      }
      .split-cell { white-space: nowrap; }
      .split-label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-muted); font-size: 12px; }
      .split-label:hover { color: var(--text-secondary); }

      /* Clickable rows and links that are not buttons, and so are not covered by
         the blanket `button:hover` rule above. A pointer cursor promises the
         thing reacts; these are that reaction. Added after a check found six
         such elements across the app offering the promise and doing nothing —
         checkbox rows in the column picker, the value filter, the file
         associations dialog and the splits dialog, plus an inline link. */
      .click-row:hover { background: var(--bg-hover-row); }
      .link-inline:hover { text-decoration: underline; }
      .cardinality-hint { color: var(--text-faint); font-size: 12px; }
      .mapping-footer {
        display: flex; align-items: center; gap: 12px; padding: 10px 16px;
        border-top: 1px solid var(--border-strong); flex-shrink: 0; background: var(--bg-toolbar);
        justify-content: flex-end;
      }
      /* Sized to hold the duplicate-role message, which names every clashing
         column and so can run long — it must wrap rather than squeeze the
         footer's buttons off the row. */
      .mapping-validation { font-size: 12px; color: var(--error-text); max-width: 46ch; line-height: var(--leading-base); }
      .mapping-validation:empty { display: none; }
      .pass-bin-group { display: flex; align-items: center; gap: 6px; margin-right: auto; font-size: 12px; color: var(--text-muted); }
      .pass-bin-group input { background: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary); padding: 2px 6px; border-radius: var(--radius-control); font-size: 12px; width: 80px; }
      /* THE primary button — same story as .btn-secondary: this class existed
         and dialogs rebuilt it inline anyway (splitsUI's Done, waferGeometryUI's
         Apply). Body tier, padding on the scale. */
      .btn-primary {
        background: var(--btn-primary-bg); border: none; color: var(--btn-primary-text);
        padding: var(--space-sm) var(--space-xxl); border-radius: var(--radius-control);
        cursor: pointer; font-size: 12px; font-weight: 600;
      }
      .btn-primary:hover { background: var(--btn-primary-hover); }
      .btn-primary:disabled { opacity: 0.4; cursor: default; }

      /* Sortable column header. Deliberately inherits the header cell's own font
         and colour — it is the header, made pressable, not a control placed in
         one. A shared button shape would fight the table's typography. */
      .btn-header {
        display: flex; align-items: center; gap: var(--space-xs); flex: 1;
        border: none; background: none; padding: 0; cursor: pointer;
        font: inherit; color: inherit; text-align: left; white-space: nowrap;
      }
      .btn-header:hover { color: var(--accent); background: none; }

      /* The ▾ that opens a column's filter popover. `.is-on` marks a column
         that currently has a filter applied. */
      .btn-caret {
        margin-left: auto; border: none; background: none; cursor: pointer;
        font-size: 12px; color: var(--text-muted); padding: 0 var(--space-xxs);
        border-radius: var(--radius-control);
      }
      .btn-caret:hover { color: var(--accent); background: var(--bg-hover-row); }
      .btn-caret.is-on { color: var(--accent); }

      /* Split button outside the toolbar — same idea as .tb-split above, for the
         dialog-weight .btn-secondary. Used by the test selector's "Load
         definitions ▾", where the verb is on the button and the caret answers
         which file. Kept separate from .tb-split rather than generalised: the two
         wrap different button classes with different borders and paddings, and a
         single rule covering both would have to name both anyway. */
      .btn-split { display: inline-flex; align-items: stretch; }
      .btn-split > .btn-secondary:first-child {
        border-top-right-radius: 0; border-bottom-right-radius: 0;
      }
      .btn-split > .btn-secondary + .btn-secondary {
        border-top-left-radius: 0; border-bottom-left-radius: 0;
        /* One shared seam, not two adjacent borders rendering 2px thick. */
        border-left: none; padding-left: var(--space-sm); padding-right: var(--space-sm);
        position: relative;
      }
      .btn-split > .btn-secondary + .btn-secondary::before {
        content: ''; position: absolute; left: 0; top: var(--space-xxs); bottom: var(--space-xxs);
        width: 1px; background: var(--border-mid);
      }

      /* Inline text action — reads as a link, behaves as a button (Select all,
         Select none, Clear). Borderless by design; the colour and underline on
         hover are its whole affordance. */
      .btn-link {
        background: none; border: none; padding: 0; cursor: pointer;
        font-size: 12px; color: var(--accent);
      }
      .btn-link:hover { text-decoration: underline; background: none; }
      .btn-link:disabled { opacity: 0.4; cursor: default; text-decoration: none; }
      /* Muted variant for a secondary action in the same row (Clear). */
      .btn-link--muted { color: var(--text-muted); }

      /* Selected state for a segmented/filter button. A class, not an inline
         style: the previous version wrote `style.background` directly on click,
         which permanently outranked `.btn-secondary:hover` — so once any filter
         had been clicked, none of them reacted to the pointer again. */
      .btn-secondary.is-on {
        background: var(--btn-primary-bg);
        border-color: var(--btn-primary-bg);
        color: var(--btn-primary-text);
        font-weight: 600;
      }
      .btn-secondary.is-on:hover { background: var(--btn-primary-hover); border-color: var(--btn-primary-hover); color: var(--btn-primary-text); }

      /* Recent-file row: a wide, two-line button listing a file set. Its own
         shape (block layout, left-aligned) but it is a button and must react. */
      .btn-row {
        flex: 1; min-width: 0; text-align: left; background: none;
        border: 1px solid var(--border-dim); border-radius: var(--radius-control);
        color: var(--text-secondary); font-size: 12px;
        padding: var(--space-xs) var(--space-md); cursor: pointer;
        display: flex; flex-direction: column; gap: 1px; overflow: hidden;
      }
      .btn-row:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover-row); }

      /* Menu row inside an anchored dropdown (Recent, Help, Lot ▾). Full-width,
         borderless; the hover background IS its affordance. */
      .menu-row {
        display: flex; align-items: center; gap: var(--space-sm); width: 100%;
        text-align: left; background: none; border: none;
        border-radius: var(--radius-control);
        padding: var(--space-sm) var(--space-lg); font-size: 12px;
        color: var(--text-secondary); cursor: pointer;
      }
      .menu-row:hover:not(:disabled) { background: var(--bg-hover-row); }
      .menu-row:disabled { color: var(--text-veryfaint); cursor: default; }

      /* Chip — a small selectable pill (the Splits dialog's quick-fill names).
         Distinct from .btn-secondary: fully rounded, smaller, meta-tier text.
         It IS a button element, which is why an automated "is this a button?"
         check wrongly gave it the secondary-button style. */
      .btn-chip {
        background: none; border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: var(--space-xxs) var(--space-md); border-radius: var(--radius-pill);
        cursor: pointer; font-size: 12px;
      }
      .btn-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover-row); }

      /* Bare icon button (dialog close, inline actions). Was rebuilt inline at
         several sites, none of which agreed on the hover treatment. */
      .btn-icon {
        background: none; border: none; color: var(--text-dim); cursor: pointer;
        padding: var(--space-xs); border-radius: var(--radius-control);
        display: inline-flex; align-items: center; justify-content: center; line-height: 1;
      }
      .btn-icon:hover { color: var(--accent); background: var(--bg-hover-row); }
      .btn-icon:disabled { opacity: 0.4; cursor: default; }
      /* THE secondary button. There were two: this class and a SECONDARY_BTN_CSS
         string in modal.ts used at 25 sites, differing in border, colour,
         padding and size — and only this one had a hover state, so half the
         app's buttons reacted to the pointer and half didn't. The constant is
         gone; this is the single definition. Values: body tier (12px), padding
         on the spacing scale, --border-mid/--text-secondary from the constant
         (the more legible pair of the two). */
      .btn-secondary {
        background: none; border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: var(--space-sm) var(--space-xl); border-radius: var(--radius-control);
        cursor: pointer; font-size: 12px;
      }
      .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-hover-row); }
      .btn-secondary:disabled { opacity: 0.4; cursor: default; }

      /* Rename overlay — reuses mapping-panel styles */
      #tsmap-rename-overlay {
        position: fixed; inset: 0; z-index: var(--z-modal);
        background: var(--bg-overlay); display: flex; flex-direction: column;
        overflow: hidden;
      }
      .rename-file { font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace; color: var(--text-muted); font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rename-arrow { color: var(--text-veryfaint); text-align: center; padding: 0 8px; }
      .rename-input {
        background: var(--bg-input); border: 1px solid var(--border-mid); color: var(--text-secondary);
        padding: 4px 8px; border-radius: var(--radius-control); font-size: 13px; width: 200px;
      }
      .rename-count { color: var(--text-faint); font-size: 12px; padding-left: 12px; }

      /* Append confirmation */
      .append-summary { margin-bottom: 12px; font-size: 13px; color: var(--text-tertiary); }
      .append-warnings { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
      .append-warning { display: flex; gap: 8px; font-size: 12px; padding: 6px 10px; border-radius: var(--radius-control); }
      .append-warn { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
      .append-info { background: var(--info-bg); color: var(--info-text); border: 1px solid var(--info-border); }
      .warn-icon { flex-shrink: 0; }
      .append-ok { font-size: 12px; color: var(--ok-text); margin-bottom: 16px; }
      .btn-warn { background: var(--warn-btn-bg) !important; }
      .btn-warn:hover { background: var(--warn-btn-hover) !important; }

      /* Long-format modal + user-guide modal (both use this backdrop).
         --z-modal clears wmap's overlay band (see the scale in :root). */
      .tsmap-modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: var(--z-modal);
        display: flex; align-items: center; justify-content: center;
      }
      .tsmap-modal {
        background: var(--bg-overlay); border: 1px solid var(--border-mid); border-radius: var(--radius-container);
        padding: 24px; max-width: 420px; color: var(--text-light);
      }
      .tsmap-modal h3 { margin-bottom: 10px; font-size: 15px; }
      .tsmap-modal p  { margin-bottom: 16px; font-size: 13px; color: var(--text-subdued); line-height: var(--leading-base); }
      .tsmap-modal-buttons { display: flex; gap: 10px; justify-content: flex-end; }
      .muted { color: var(--text-faint); font-size: 12px; }

      /* The append confirmation renders INSIDE openModal's box, which already
         draws the surface, border, radius and title bar — so the .tsmap-modal
         chrome it shares with the standalone dialogs has to be stripped back to
         padding alone, or it paints a second card inside the first.
         Written as `.tsmap-modal.append-modal` deliberately: a bare
         `.append-modal` ties on specificity with `.tsmap-modal` above and would
         lose on source order, which is exactly how the double card appeared. */
      .tsmap-modal.append-modal {
        background: none; border: none; border-radius: 0;
        max-width: none; width: 100%; padding: 16px 16px 16px;
      }
      .tsmap-modal.append-modal .append-warnings { margin-bottom: 16px; }
      .tsmap-modal.append-modal .append-summary { margin-bottom: 12px; }

      /* ── Help button + modal ───────────────────────────────────────── */
      #help-btn {
        background: none; border: none;
        color: var(--text-muted);
        padding: 0; cursor: pointer; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #help-btn:hover { color: var(--accent); }

      /* ── Log panel ─────────────────────────────────────────────── */
      #log-bar {
        flex-shrink: 0; background: var(--bg-toolbar); border-top: 1px solid var(--border-strong);
      }
      #log-toggle {
        width: 100%; background: none; border: none; border-bottom: 1px solid transparent;
        color: var(--text-dim); font-size: 12px; padding: 4px 12px;
        cursor: pointer; user-select: none;
        display: flex; align-items: center; justify-content: flex-end; gap: 6px;
      }
      #log-toggle:hover { color: var(--text-tertiary); }
      /* Chevron indicates the panel can be opened/closed; rotates when open. */
      #log-toggle::after {
        content: ''; width: 7px; height: 7px;
        border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
        transform: rotate(-135deg); transition: transform 0.15s; margin-bottom: -2px;
      }
      #log-toggle[aria-expanded="true"]::after { transform: rotate(45deg); margin-bottom: 2px; }
      /* Hugs its content up to a cap rather than always claiming 120px. A
         fresh session's log is four or five lines; the fixed height spent a
         quarter of a short viewport on empty space and cropped the top row of
         wafer maps through the middle of the disc to do it. */
      #log-panel {
        display: none; max-height: min(120px, 22vh); overflow-y: auto;
        padding: 4px 12px 6px;
      }
      #log-panel.open { display: block; border-top: 1px solid var(--border-subtle); }
      .log-entry {
        font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', monospace;
        font-size: 12px; line-height: var(--leading-base);
        white-space: pre-wrap; word-break: break-all;
        color: var(--text-muted);
      }
      .log-error { color: var(--error-text); }
      .log-warn  { color: var(--warn-text); }
      .log-info  { color: var(--text-muted); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <span id="toolbar-title">tsmap</span>
        <div id="drop-zone" title="Open wafer-map files — or drop them anywhere">
          <span class="tb-split">
            <button id="open-btn" class="tb-btn tb-btn--primary" title="Open wafer-map files — or drop them anywhere">Open files</button>
            <button id="open-more-btn" class="tb-btn tb-btn--primary" aria-haspopup="menu" aria-expanded="false"
              aria-label="Choose how to pick files to open" title="Pick files, or scan a whole folder"><span class="tb-caret">▾</span></button>
          </span>
          <input id="file-input" type="file" multiple
            accept=".stdf,.std,.atdf,.atd,.csv,.json,.parquet,.gz,.zip,.txt,.dat"
            style="display:none" />
        </div>
        <span class="tb-split">
          <button id="add-btn" class="tb-btn" disabled title="Append more files to the current view">Add files</button>
          <button id="add-more-btn" class="tb-btn" disabled aria-haspopup="menu" aria-expanded="false"
            aria-label="Choose how to pick files to add" title="Pick files, or scan a whole folder"><span class="tb-caret">▾</span></button>
        </span>
        <span class="tb-sep" style="display:none"></span>
        <button id="lot-btn" class="tb-btn" style="display:none" aria-haspopup="menu" aria-expanded="false"
          title="Test and bin definitions, wafer splits, geometry, and analysis options">Setup <span class="tb-caret">▾</span></button>
        <span class="tb-sep" style="display:none"></span>
        <button id="reset-btn" class="tb-btn tb-btn--danger" style="display:none" title="Unload all files and return to the start screen">Clear files</button>
        <span id="drop-hint">or drop a file anywhere</span>
        <span id="busy-spinner"></span>
        <span id="file-label"></span>
        <button id="help-btn" class="btn-icon" aria-label="Help" title="Help"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
      </div>
      <div id="map-container"></div>
      <div id="log-bar">
        <button id="log-toggle" class="btn-secondary" aria-expanded="false" title="Show the log panel">Log</button>
        <div id="log-panel">
          <div id="log-list"></div>
        </div>
      </div>
    </div>
  </body>
</html>
