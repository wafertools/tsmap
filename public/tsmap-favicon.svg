<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- tsmap browser-tab / window icon. Same wafer glyph as the app's empty
       state (see #map-container's placeholder in index.html): outer wafer edge,
       a dashed exclusion-zone ring, the die grid centre, and four crosshair
       ticks for the notch axes.

       Colour follows the viewer's OS theme rather than being pinned, so the
       glyph keeps contrast on both a light and a dark browser tab strip.
       SVG favicons honour prefers-color-scheme in Chrome and Firefox; anything
       that ignores it gets the light-mode stroke, which still reads on the
       mid-grey tab backgrounds those browsers use. -->
  <style>
    :root { --wafer: #1a6bbf; }
    @media (prefers-color-scheme: dark) { :root { --wafer: #66aaff; } }
    .w { stroke: var(--wafer); fill: none; stroke-linecap: round; }
  </style>
  <g class="w">
    <circle cx="32" cy="32" r="27" stroke-width="4"/>
    <circle cx="32" cy="32" r="17" stroke-width="3" stroke-dasharray="3 3.5"/>
    <circle cx="32" cy="32" r="7"  stroke-width="3"/>
    <line x1="32" y1="1"  x2="32" y2="9"  stroke-width="4"/>
    <line x1="32" y1="55" x2="32" y2="63" stroke-width="4"/>
    <line x1="1"  y1="32" x2="9"  y2="32" stroke-width="4"/>
    <line x1="55" y1="32" x2="63" y2="32" stroke-width="4"/>
  </g>
</svg>
